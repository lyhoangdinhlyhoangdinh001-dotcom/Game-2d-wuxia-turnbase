     const sz=(2.2+rn(n+51)*2.4)*(1-u*.65);
     if(sz>.2){
      g.fillStyle=`rgba(${n%2?'225,175,255':'175,185,200'},${.85*(1-u)})`;
      g.beginPath();g.arc(px,py,sz,0,7);g.fill();
     }
    }
   }catch(e){}
   if(u<1)requestAnimationFrame(step);
   else finish();
  };
  requestAnimationFrame(step);
  setTimeout(finish,durMs+200);
 });
}

async function slideCompact(k,durMs=260){
 const B=G[k].board;
 const prevPos=new Map();
 B.forEach((m,oldIdx)=>{if(m)prevPos.set(m,oldIdx)});
 compact(B);
 const moves=[];
 B.forEach((m,newIdx)=>{
  if(!m)return;
  const oldIdx=prevPos.get(m);
  if(oldIdx!==undefined&&oldIdx!==newIdx)moves.push([m,oldIdx,newIdx]);
 });
 if(!moves.length)return;
 render();
 await new Promise(resolve=>{
  requestAnimationFrame(()=>{
   let pending=0,doneSlide=false;
   const finishSlide=()=>{
    if(doneSlide)return;
    doneSlide=true;
    resolve();
   };
   moves.forEach(([m,oldIdx,newIdx])=>{
    const elOld=document.querySelector(`.slot[data-s="${k}"][data-i="${oldIdx}"]`);
    const elNew=document.querySelector(`.slot[data-s="${k}"][data-i="${newIdx}"] .mon`);
    if(!elOld||!elNew||!elNew.animate)return;
    const dx=elOld.getBoundingClientRect().left-elNew.getBoundingClientRect().left;
    if(Math.abs(dx)<.5)return;
    pending++;
    try{
     const anim=elNew.animate([
      {transform:`translateX(${dx}px)`},
      {transform:'translateX(0px)'}
     ],{duration:durMs,easing:'cubic-bezier(.22,.85,.36,1)',fill:'both'});
     anim.onfinish=()=>{
      try{anim.cancel()}catch(e){}
      if(--pending<=0)finishSlide();
     };
    }catch(e){
     if(--pending<=0)finishSlide();
    }
   });
   if(pending===0)finishSlide();
   setTimeout(finishSlide,durMs+100);
  });
 });
}

async function clean(){
 const dead=[];
 ['p','o'].forEach(k=>{const B=G[k].board;B.forEach((m,j)=>{if(m&&m.h<=0)dead.push([k,j,m])})});
 if(!dead.length)return;
 dead.forEach(()=>sfx('die'));
 await Promise.all(dead.map(([k,j])=>vfxDie(k,j,680)));
 const movedSides=new Set();
 dead.forEach(([k,j])=>{G[k].board[j]=null;movedSides.add(k)});
 for(const k of movedSides){await slideCompact(k,260)}
}

async function attack(k){const S=G[k],ek=k=='p'?'o':'p',E=G[ek];
 for(const m of[...S.board].reverse()){const i=S.board.indexOf(m);if(!m||i<0||m.h<=0||!canAtk(m,i))continue;
  const acts=atks(m).filter(a=>act(a,i));
  for(const at of acts){
   if(m.h<=0)break;
   if(at.team){
    const ws=[0,1,2].filter(j=>S.board[j]&&S.board[j].h>0&&S.board[j].h<S.board[j].mh);
    if(!ws.length)continue;
    const hvs=ws.map(j=>vfxHeal(k,i,k,j,1600));
    await Promise.all(hvs.map(x=>x.hitPeak));
    const gain=ws.map(j=>{const a=S.board[j],p0=a.h;a.h=Math.min(a.mh,a.h+at.d);return a.h-p0});
    G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' (hồi toàn đội) '+ws.map((j,n)=>S.board[j].n+' +'+gain[n]).join(', '));
    sfx('heal');render();ws.forEach((j,n)=>fx(k,j,'+'+gain[n]));
    await Promise.all(hvs.map(x=>x.done));
    await sleep(200);
    continue;
   }
   if(at.hl){
    const wounded=[0,1,2].filter(j=>S.board[j]&&S.board[j].h>0&&S.board[j].h<S.board[j].mh);
    if(!wounded.length)continue;
    wounded.sort((a,b)=>S.board[a].h-S.board[b].h||Math.abs(a-i)-Math.abs(b-i));
    const ti=wounded[0],ally=S.board[ti],prevH=ally.h;
    const hv=vfxHeal(k,i,k,ti,1600);
    await hv.hitPeak;
    ally.h=Math.min(ally.mh,ally.h+at.d);
    const healed=ally.h-prevH;
    G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' (trị liệu) hồi +'+healed+' máu cho '+ally.n);
    sfx('heal');render();fx(k,ti,'+'+healed);
    await hv.done;
    await sleep(200);
    continue;
   }
   const al=[0,1,2].filter(j=>E.board[j]);if(!al.length)break;
   const rg=at.r,j=at.mg?(E.board[i]?i:al[0]):at.dc?rnd(al):rg?(i==1?[2,1,0]:[1,2,0]).find(x=>E.board[x]):al[0],t=E.board[j];
   const kind=at.mg?'orb':at.dc?'dart':at.r?'arrow':'slash',durMs=FXT[kind][0]*SPD[kind];
   const cr=Math.random()<(at.mg?CRIT.staff:at.dc?CRIT.dart:at.r?CRIT.bow:CRIT.sword)+(m.x||0)/100,ad=at.dc?(1+Math.floor(Math.random()*at.d))*(cr?CRIT.mul:1):cr?at.d*CRIT.mul:at.d;
   const fv=vfx(m,{...at,d:ad},k,i,ek,j);
   await fv.peak;
   const tx=hit(t,ad,at.mg,cr),sh=SH;
   const tDead=t.h<=0;
   if(m.v>0&&m.h>0&&tx!='Chặn!'&&tx!='-0'){const dv=Math.min(m.mh-m.h,m.v);if(dv>0){m.h+=dv;G.lg.push('↳ '+m.n+' hút máu +'+dv)}}
   const hasThorn=!rg&&!at.mg&&!at.dc&&t.t>0;
   G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' ('+(at.mg?'trượng':rg?'cung':at.dc?'xúc xắc 🎲'+ad:'kiếm')+') đánh '+t.n+(cr&&tx!='Chặn!'?' 💥 CHÍ MẠNG':'')+' ('+tx+(sh?' 🛡️'+sh:'')+')'+(tDead?' ☠️ '+t.n+' bị diệt':''));
   setTimeout(()=>{const q=tx=='Chặn!'?'block':cr?'crit':sh?'shield':'hit';sfx(q)},40);
   render();if(sh>0){if(cr)fx(ek,j,'-'+ad,'crt');else{fx(ek,j,'-'+sh,'shl');if(tx!='-0')setTimeout(()=>fx(ek,j,tx,''),380)}}else fx(ek,j,tx,cr&&tx[0]=='-'?'crt':'');
   await fv.done;
   if(hasThorn&&m.h>0&&E.board[j]){
    const tv=vfxThorn(k,i,ek,j,durMs);
    await tv.hitPeak;
    const rx=hit(m,t.t),rsh=SH;
    G.lg.push('↳ Phản gai từ '+t.n+' → '+m.n+' ('+rx+')'+(m.h<=0?' ☠️ '+m.n+' bị diệt':''));
    sfx('thorn');render();if(rsh>0)fx(k,i,'-'+rsh,'shl');else fx(k,i,rx);
    await tv.done;
    await clean();
    render();
    await sleep(200);
   }else{
    if(tDead){
     await clean();
     render();
    }
    await sleep(220);
   }
  }
  await sleep(60)}
 return lost('o')||lost('p')}

async function enemy(){const S=G.o;let en=G.oen;
 for(let n=0;n<8;n++){const emp=[0,1,2].filter(j=>!S.board[j]),mons=[0,1,2].filter(j=>S.board[j]);let pk=null,ti=null;
  const opts=S.hand.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.c<=en);
  for(const x of opts)if(x.c.y=='m'&&emp.length){pk=x;ti=emp[0];break}
  if(!pk)for(const x of opts)if(x.c.y=='i'&&mons.length){let ts=mons;if(x.c.k=='h')ts=mons.filter(j=>S.board[j].h<S.board[j].mh);if(x.c.k=='t')ts=mons.filter(j=>!S.board[j].r);if(x.c.k=='b')ts=mons.filter(j=>!S.board[j].b);if(x.c.q=='e')ts=ts.filter(j=>!S.board[j].eq);if(ts.length){pk=x;ti=rnd(ts);break}}
  if(!pk)break;en-=pk.c.c;if(!(pk.c.y!='m'&&CARDFX[pk.c.k]))sfx(pk.c.y=='m'?'play':'item');{const tm=S.board[ti];G.lg.push('Địch: '+pk.c.n+(pk.c.y=='m'?' → ô '+(ti+1):' → '+tm.n))}if(pk.c.y!='m'&&CARDFX[pk.c.k]){try{await CARDFX[pk.c.k](S,'o',pk.i,ti)}catch(e){render()}}else{useCard(S,pk.i,ti);render()}await sleep(600)}G.oen=en}
function fin(){const a=lost('o'),b=lost('p');let r;
 r=a&&b?'🤝 Hòa':a?'🏆 Bạn thắng!':'💀 Bạn thua';
 const g=r.startsWith('🏆')?100:r.startsWith('💀')?30:50,st=SV.stats;SV.gold+=g;if(g==100){st.win++;st.streak++}else{if(g==30)st.lose++;st.streak=0}saveSV();
 $('#ovt').innerHTML=r+' · +'+g+' <em class="gi"></em>';$('#ov').style.display='flex';sfx(r.startsWith('🏆')?'win':r.startsWith('💀')?'lose':'turn')}
async function endTurn(){if(G.busy)return;G.busy=true;G.sel=null;G.sac=false;sfx('turn');render();
 try{
  if(await attack('p'))return fin();
  await sleep(400);await enemy();
  if(await attack('o'))return fin();
  for(const S of[G.p,G.o])for(const m of S.board)if(m&&m.g>0&&m.s<m.s0)m.s=Math.min(m.s0,m.s+m.g);
  G.turn++;G.lg.push('— Lượt '+G.turn+' —');
  G.en+=3;G.oen+=3;G.sd=false;sfx('turn');
 }finally{
  G.busy=false;render();
 }}
function sacrifice(w,i){const S=G.p;let c,g;
 if(w=='h'){c=S.hand[i];g=c.y=='m'?2:1;const n=draw(S,c.y);if(n)S.hand[i]=n;else S.hand[i]=null}
 else{c=S.board[i];g=1;S.board[i]=null;compact(S.board)}
 G.en+=g;G.sd=true;G.sac=false;G.sel=null;G.lg.push('Bạn hiến tế '+c.n+' → +'+g+' ⚡');sfx('item');render()}
$('#sac').onclick=()=>{if(G.busy||G.sd)return;G.sac=!G.sac;G.sel=null;sfx('pick');render()};
let LPT=0,LPD=false,LPX=0,LPY=0;
const lpStop=()=>{clearTimeout(LPT);LPT=0};
$('#hand').addEventListener('pointerdown',e=>{LPD=false;lpStop();const c=e.target.closest('.cd');if(!c||G.busy)return;const cd=G.p.hand[+c.dataset.i];if(!cd)return;LPX=e.clientX;LPY=e.clientY;LPT=setTimeout(()=>{LPT=0;LPD=true;inspectCard(cd)},450)});
$('#hand').addEventListener('pointermove',e=>{if(LPT&&Math.hypot(e.clientX-LPX,e.clientY-LPY)>10)lpStop()});
['pointerup','pointerleave','pointercancel'].forEach(t=>$('#hand').addEventListener(t,lpStop));
$('#hand').addEventListener('contextmenu',e=>e.preventDefault());
$('#hand').onclick=e=>{if(LPD){LPD=false;return}const c=e.target.closest('.cd');if(!c||G.busy)return;const i=+c.dataset.i,cd=G.p.hand[i];if(!cd)return;
 if(G.sac)return sacrifice('h',i);
 G.sel=G.sel===i?null:i;sfx('pick');render()};
$('#p').onclick=e=>{const s=e.target.closest('.slot');if(!s||G.busy)return;const i=+s.dataset.i;
 if(G.sac){if(G.p.board[i])sacrifice('b',i);return}
 if(G.sel==null||!valid(i)){if(G.p.board[i])inspect('p',i);return}
 const c=G.p.hand[G.sel],tm=G.p.board[i],hi=G.sel;G.lg.push('Bạn: '+c.n+(c.y=='m'?' → ô '+(i+1):' → '+tm.n));G.en-=c.c;if(c.y!='m'&&CARDFX[c.k]){G.sel=null;G.busy=true;CARDFX[c.k](G.p,'p',hi,i).catch(()=>{}).finally(()=>{G.busy=false;render()})}else{sfx(c.y=='m'?'play':'item');useCard(G.p,hi,i);G.sel=null;render()}};
$('#o').onclick=e=>{const s=e.target.closest('.slot');if(!s||G.busy)return;inspect('o',+s.dataset.i)};
$('#ins').onclick=()=>{$('#ins').style.display='none'};
$('#end').onclick=endTurn;$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊';if(!mute)sfx('pick')};const openLog=()=>{let eo=false;$('#lgl').innerHTML=G.lg.map(t=>{if(t[0]=='—')return`<div class="tn">${t}</div>`;if(t[0]!='↳')eo=t.startsWith('Địch');return`<div${eo?' class="en"':''}>${t}</div>`}).join('');$('#lgp').style.display='flex';$('#lgl').scrollTop=1e9};
$('#lgb').onclick=$('#lgb2').onclick=openLog;$('#lgx').onclick=()=>$('#lgp').style.display='none';
$('#sur').onclick=()=>{if(G.busy||$('#ov').style.display=='flex')return;$('#cf').style.display='flex'};
$('#cfn').onclick=()=>{$('#cf').style.display='none'};
$('#cfy').onclick=()=>{$('#cf').style.display='none';if(G.busy)return;G.busy=true;G.sel=null;G.lg.push('Bạn đã đầu hàng');$('#ovt').textContent='🏳️ Bạn đã đầu hàng';$('#ov').style.display='flex';sfx('lose');render()};
$('#cl').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const y=b.dataset.y,c=(y=='m'?M:I).find(x=>x.n==b.dataset.n),lv=lvOf(c,y);if(lv>=(y=='m'?MAXQ:MAXI))return;const cost=(y=='m'?QC:IC)[lv-1];if(SV.gold<cost)return;SV.gold-=cost;SV.lv[c.n]=lv+1;saveSV();sfx('item');openCol()};
$('#cadd').onclick=()=>{SV.gold+=10000;saveSV();sfx('item');openCol()};
let delT=0;$('#cdel').onclick=()=>{const b=$('#cdel');if(!delT){b.textContent='Bấm lần nữa để xoá save';delT=setTimeout(()=>{delT=0;b.textContent='Xoá save'},3000);return}clearTimeout(delT);delT=0;b.textContent='Xoá save';SV={v:1,gold:0,lv:{},stats:{win:0,lose:0,streak:0}};try{localStorage.removeItem(SK)}catch(e){}sfx('turn');openCol()};
$('#cx').onclick=()=>{$('#col').style.display='none'};$('#colb').onclick=$('#colb2').onclick=openCol;
$('#again').onclick=start;
start();
</script></body></html>
