function levelDiffText(c,y,lv){
 if(lv<=1)return 'Chỉ số cơ bản khởi điểm';
 const prev=lvCard(c,y,lv-1),cur=lvCard(c,y,lv);
 const diffs=[];
 if(y=='m'){
  const map=[
   ['a',atkName(c),''],
   ['h','máu',''],
   ['s','khiên',''],
   ['t','gai',''],
   ['x','bạo kích','%'],
   ['v','hút máu',''],
   ['p','hồi toàn đội',''],
   ['lt','lần phóng phi tiêu',''],
   ['lc','lần chém kiếm',''],
   ['lb','lần bắn cung',''],
   ['lp','lần đánh trượng',''],
   ['pd','phản đòn','']
  ];
  for(const[k,lbl,suf]of map){
   const d=(cur[k]||0)-(prev[k]||0);
   if(d)diffs.push(`+${d}${suf} ${lbl}`);
  }
  if(LVK[lv]&&LVK[lv][c.n])diffs.push(`${LVK[lv][c.n].f&&LVK[lv][c.n].f.p?'Mở đòn đánh':'Mở kỹ năng'}: ${LVK[lv][c.n].t}`);
 }else{
  const dv=(cur.v||0)-(prev.v||0);
  if(dv)diffs.push(`+${dv} ${KL[c.k]||'hiệu lực'}`);
 }
 return diffs.length?`Mới so với cấp ${lv-1}: ${diffs.join(', ')}`:`Không đổi chỉ số so với cấp ${lv-1}`;
}

 try{sfx('die')}catch(e){}
 const bd=$('#board'),B=bd.getBoundingClientRect(),el=document.querySelector(`.slot[data-s="${k}"][data-i="${j}"]`);
 const r=el?el.getBoundingClientRect():{left:B.left+B.width/2,top:B.height/2,width:B.width*.24,height:B.height*.15};
 const cx=r.left-B.left+r.width/2,cy=r.top-B.top+r.height/2,w=r.width||B.width*.24;
 const mon=el?.querySelector('.mon');
 let dieAnim=null;
 if(mon){
  mon.style.pointerEvents='none';
  try{
   dieAnim=mon.animate([
    {transform:'scale(1) rotate(0deg)',opacity:1,filter:'brightness(1.8) saturate(.6)'},
    {transform:'scale(1.06) rotate(-4deg)',opacity:.88,filter:'brightness(1.2) grayscale(.45)',offset:.25},
    {transform:'translateY(14px) scale(.62) rotate(7deg)',opacity:0,filter:'brightness(.35) grayscale(1) blur(2px)'}
   ],{duration:durMs,easing:'cubic-bezier(.22,.8,.36,1)',fill:'forwards'});
  }catch(e){}
 }
 const mg=w*1.9,ox=Math.max(0,cx-mg),oy=Math.max(0,cy-mg);
 const bw=Math.max(20,Math.min(B.width,cx+mg)-ox),bh=Math.max(20,Math.min(B.height,cy+mg)-oy);
 const cv=document.createElement('canvas'),dp=Math.min(1.5,devicePixelRatio||1);
 cv.width=bw*dp|0;cv.height=bh*dp|0;
 cv.style.cssText=`position:absolute;left:${ox}px;top:${oy}px;width:${bw}px;height:${bh}px;pointer-events:none;z-index:8`;
 bd.appendChild(cv);
 const g=cv.getContext('2d'),sx=cv.width/bw,sy=cv.height/bh;
 g.setTransform(sx,0,0,sy,-ox*sx,-oy*sy);
 return new Promise(resolve=>{
  let t0,doneFlag=false;
  const finish=()=>{
   if(doneFlag)return;doneFlag=true;
   try{cv.remove()}catch(e){}
   if(dieAnim){try{dieAnim.cancel()}catch(e){}}
   resolve();
  };
  const step=ts=>{
   if(doneFlag)return;
   t0??=ts;
   const u=cl((ts-t0)/durMs),e=eo(u);
   g.clearRect(ox,oy,bw,bh);
   try{
    fxGlow(g,cx,cy,w*lp(.25,1.25,e),'190,115,255',.65*(1-u));
    fxGlow(g,cx,cy,w*lp(.15,.75,e),'255,140,120',.45*(1-u));
    fxRing(g,cx,cy+lp(0,10,e),lp(6,w*.95,e),u,3.2,'#d49bff');
    fxSpk(g,cx,cy,u,18,w*.92,'#f2d6ff',-24);
    for(let n=0;n<14;n++){
     const a=n*2.399+rn(n+11)*.4,rad=w*(.15+rn(n+23)*.42)*e;
     const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad-(14+rn(n+37)*28)*u;
     const sz=(2.2+rn(n+51)*2.4)*(1-u*.65);
     if(sz>.2){
      g.fillStyle=`rgba(${n%2?'225,175,255':'175,185,200'},${.85*(1-u)})`;
      g.beginPath();g.arc(px,py,sz,0,7);g.fill();
     }
    }
   }catch(e){}
   if(u<1)requestAnimationFrame(step);
   else finish();
  };
  requestAnimationFrame(step);
  setTimeout(finish,durMs+200);
 });
}

async function slideCompact(k,durMs=260){
 const B=G[k].board,prevPos=new Map();
 B.forEach((m,oldIdx)=>{if(m)prevPos.set(m,oldIdx)});
 compact(B);
 const moves=[];
 B.forEach((m,newIdx)=>{
  if(!m)return;
  const oldIdx=prevPos.get(m);
  if(oldIdx!==undefined&&oldIdx!==newIdx)moves.push([m,oldIdx,newIdx]);
 });
 if(!moves.length)return;
 render();
 await new Promise(resolve=>{
  requestAnimationFrame(()=>{
   let pending=0,doneSlide=false;
   const finishSlide=()=>{if(doneSlide)return;doneSlide=true;resolve()};
   moves.forEach(([m,oldIdx,newIdx])=>{
    const elOld=document.querySelector(`.slot[data-s="${k}"][data-i="${oldIdx}"]`);
    const elNew=document.querySelector(`.slot[data-s="${k}"][data-i="${newIdx}"] .mon`);
    if(!elOld||!elNew||!elNew.animate)return;
    const dx=elOld.getBoundingClientRect().left-elNew.getBoundingClientRect().left;
    if(Math.abs(dx)<.5)return;
    pending++;
    try{
     const anim=elNew.animate([{transform:`translateX(${dx}px)`},{transform:'translateX(0px)'}],{duration:durMs,easing:'cubic-bezier(.22,.85,.36,1)',fill:'both'});
     anim.onfinish=()=>{try{anim.cancel()}catch(e){};if(--pending<=0)finishSlide()};
    }catch(e){if(--pending<=0)finishSlide()}
   });
   if(pending===0)finishSlide();
   setTimeout(finishSlide,durMs+100);
  });
 });
}

async function clean(){
 const dead=[];
 ['p','o'].forEach(k=>{const B=G[k].board;B.forEach((m,j)=>{if(m&&m.h<=0)dead.push([k,j,m])})});
 if(!dead.length)return;
 dead.forEach(()=>sfx('die'));
 await Promise.all(dead.map(([k,j])=>vfxDie(k,j,680)));
 const movedSides=new Set();
 dead.forEach(([k,j])=>{G[k].board[j]=null;movedSides.add(k)});
 for(const k of movedSides){await slideCompact(k,260)}
}

// Một cú đánh trọn vẹn (chí mạng, khiên, hút máu, gai, hiệu ứng). Đòn thường và đòn phản dùng chung
async function strike(k,i,m,at,j,back){
 const ek=k=='p'?'o':'p',E=G[ek],t=E.board[j];
 const rg=at.r,kind=at.mg?'orb':at.dc?'dart':at.r?'arrow':'slash',durMs=FXT[kind][0]*SPD[kind];
 const cr=Math.random()<(at.mg?CRIT.staff:at.dc?CRIT.dart:at.r?CRIT.bow:CRIT.sword)+(m.x||0)/100;
 const ad=at.dc?(1+Math.floor(Math.random()*at.d))*(cr?CRIT.mul:1):cr?at.d*CRIT.mul:at.d;
 if(at.again){fx(k,i,comboName(at)+'!','blk');await sleep(350)}
 const fv=vfx(m,{...at,d:ad},k,i,ek,j);
 await fv.peak;
 const tx=hit(t,ad,at.mg,cr),sh=SH,sd=SD,tDead=t.h<=0;
 let drain=null;
 if(m.v>0&&m.h>0&&tx!='-0'){const dv=Math.min(m.mh-m.h,m.v);if(dv>0){const h0=m.h;m.h+=dv;G.lg.push('↳ '+m.n+' hút máu +'+dv);drain={dv,h0,h1:m.h};m.h=h0}}
 const hasThorn=!rg&&!at.mg&&!at.dc&&t.t>0;
 G.lg.push((back?'↳ ':(k=='p'?'Bạn':'Địch')+': ')+m.n+(back?' phản đòn ↩️':'')+' ('+(at.again&&!at.dc?comboName(at).toLowerCase()+' 🔁 ':'')+(at.mg?'trượng':rg?'cung':at.dc?(at.again?'liên tiêu 🔁 ':'')+'xúc xắc 🎲'+ad:'kiếm')+') đánh '+t.n+(cr?' 💥 CHÍ MẠNG':'')+' ('+tx+(sh?' 🛡️'+sh:'')+')'+(tDead?' ☠️ '+t.n+' bị diệt':''));
 setTimeout(()=>{const q=cr?'crit':sh?'shield':'hit';sfx(q)},40);
 render();
 if(sh>0){if(cr)fx(ek,j,'-'+sd,'crt');else{fx(ek,j,'-'+sh,'shl');if(tx!='-0')setTimeout(()=>fx(ek,j,tx,''),380)}}
 else fx(ek,j,tx,cr&&tx[0]=='-'?'crt':'');
 let dr=null;
 if(drain){
  dr=vfxDrain(k,i,ek,j,drain.dv);
  dr.hitPeak.then(()=>{if(m.h<drain.h1)m.h=drain.h1;sfx('drainEnd');setHp(k,i,m);fx(k,i,'+'+drain.dv,'hlf drn');drainPulse(k,i)});
 }
 await fv.done;
 if(dr){await dr.done;if(m.h<drain.h1){m.h=drain.h1;setHp(k,i,m)}}
 if(hasThorn&&m.h>0&&E.board[j]){
  const tv=vfxThorn(k,i,ek,j,durMs);
  await tv.hitPeak;
  const rx=hit(m,t.t),rsh=SH;
  G.lg.push('↳ Phản gai từ '+t.n+' → '+m.n+' ('+rx+')'+(m.h<=0?' ☠️ '+m.n+' bị diệt':''));
  sfx('thorn');render();if(rsh>0)fx(k,i,'-'+rsh,'shl');else fx(k,i,rx);
  await tv.done;
  await clean();render();await sleep(200);
 }else{
  if(tDead){await clean();render()}
  await sleep(220);
 }
}

const COUNTER=.5;
// Phản đòn: d (phe dk) bị a chém thì chém trả bằng đòn kiếm của chính d
async function counter(dk,d,ak,a){
 const sw=atks(d).find(x=>!x.hl&&!x.r&&!x.mg&&!x.dc&&x.d>0);
 const di=G[dk].board.indexOf(d),ai=G[ak].board.indexOf(a);
 if(!d.pd||!sw||d.h<=0||a.h<=0||di<0||ai<0||Math.random()>=COUNTER)return;
 fx(dk,di,'Phản đòn!','blk');await sleep(350);
 await strike(dk,di,d,sw,ai,true);
 // bên vừa bị phản cũng được phản lại nếu có kỹ năng
 await counter(ak,a,dk,d);
}

async function attack(k){
 const S=G[k],ek=k=='p'?'o':'p',E=G[ek];
 for(const m of[...S.board].reverse()){
  const i=S.board.indexOf(m);
  if(!m||i<0||m.h<=0||!canAtk(m,i))continue;
  const acts=atks(m).filter(a=>act(a,i)).flatMap(a=>[a,...Array(extraHits(m,a)).fill({...a,again:true})]);
  for(const at of acts){
   if(m.h<=0)break;
   if(at.team){
    const ws=[0,1,2].filter(j=>S.board[j]&&S.board[j].h>0&&S.board[j].h<S.board[j].mh);
    if(!ws.length)continue;
    const hvs=ws.map(j=>vfxHeal(k,i,k,j,1600));
    await Promise.all(hvs.map(x=>x.hitPeak));
    const gain=ws.map(j=>{const a=S.board[j],p0=a.h;a.h=Math.min(a.mh,a.h+at.d);return a.h-p0});
    G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' (hồi toàn đội) '+ws.map((j,n)=>S.board[j].n+' +'+gain[n]).join(', '));
    sfx('heal');render();ws.forEach((j,n)=>fx(k,j,'+'+gain[n]));
    await Promise.all(hvs.map(x=>x.done));
    await sleep(200);
    continue;
   }
   if(at.hl){
    const wounded=[0,1,2].filter(j=>S.board[j]&&S.board[j].h>0&&S.board[j].h<S.board[j].mh);
    if(!wounded.length)continue;
    wounded.sort((a,b)=>S.board[a].h-S.board[b].h||Math.abs(a-i)-Math.abs(b-i));
    const ti=wounded[0],ally=S.board[ti],prevH=ally.h;
    const hv=vfxHeal(k,i,k,ti,1600);
    await hv.hitPeak;
    ally.h=Math.min(ally.mh,ally.h+at.d);
    const healed=ally.h-prevH;
    G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' (trị liệu) hồi +'+healed+' máu cho '+ally.n);
    sfx('heal');render();fx(k,ti,'+'+healed);
    await hv.done;
    await sleep(200);
    continue;
   }
   const al=[0,1,2].filter(j=>E.board[j]);if(!al.length)break;
   const rg=at.r,j=at.mg?(E.board[i]?i:al[0]):at.dc?rnd(al):rg?(i==1?[2,1,0]:[1,2,0]).find(x=>E.board[x]):al[0],t=E.board[j];
   const kind=at.mg?'orb':at.dc?'dart':at.r?'arrow':'slash';
   await strike(k,i,m,at,j);
   if(kind=='slash')await counter(ek,t,k,m);
  }
  await sleep(60);
 }
 return lost('o')||lost('p');
}

async function enemy(){
 const S=G.o;let en=G.oen;
 for(let n=0;n<8;n++){
  const emp=[0,1,2].filter(j=>!S.board[j]),mons=[0,1,2].filter(j=>S.board[j]);
  let pk=null,ti=null;
  const opts=S.hand.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.c<=en);
  for(const x of opts)if(x.c.y=='m'&&emp.length){pk=x;ti=emp[0];break}
  if(!pk)for(const x of opts)if(x.c.y=='i'&&mons.length){
   let ts=mons;
   if(x.c.k=='h')ts=mons.filter(j=>S.board[j].h<S.board[j].mh);
   if(x.c.k=='t')ts=mons.filter(j=>!S.board[j].r);
   if(x.c.q=='e')ts=ts.filter(j=>!S.board[j].eq);
   if(ts.length){pk=x;ti=rnd(ts);break}
  }
  if(!pk)break;
  en-=pk.c.c;
  if(!(pk.c.y!='m'&&CARDFX[pk.c.k]))sfx(pk.c.y=='m'?'play':'item');
  const tm=S.board[ti];
  G.lg.push('Địch: '+pk.c.n+(pk.c.y=='m'?' → ô '+(ti+1):' → '+(tm?tm.n:'sân')));
  if(pk.c.y!='m'&&CARDFX[pk.c.k]){try{await CARDFX[pk.c.k](S,'o',pk.i,ti)}catch(e){render()}}
  else{useCard(S,pk.i,ti);render()}
  await sleep(600);
 }
 G.oen=en;
}

function fin(){
 const a=lost('o'),b=lost('p');
 const r=a&&b?'🤝 Hòa':a?'🏆 Bạn thắng!':'💀 Bạn thua';
 const g=r.startsWith('🏆')?100:r.startsWith('💀')?30:50,st=SV.stats;
 SV.gold+=g;
 if(g==100){st.win++;st.streak++}else{if(g==30)st.lose++;st.streak=0}
 flushSave();
 $('#ovt').innerHTML=r+' · +'+g+' <em class="gi"></em>';
 $('#ov').style.display='flex';
 sfx(r.startsWith('🏆')?'win':r.startsWith('💀')?'lose':'turn');
}

async function endTurn(){
 if(G.busy)return;
 G.busy=true;G.sel=null;G.sac=false;sfx('turn');render();
 try{
  if(await attack('p'))return fin();
  await sleep(400);await enemy();
  if(await attack('o'))return fin();
  G.turn++;G.lg.push('— Lượt '+G.turn+' —');
  G.en+=3;G.oen+=3;G.sd=false;sfx('turn');
 }finally{
  G.busy=false;render();
 }
}

function sacrifice(w,i){
 const S=G.p;let c,g;
 if(w=='h'){c=S.hand[i];if(!c)return;g=c.y=='m'?2:1;S.hand[i]=draw(S,c.y)}
 else{c=S.board[i];if(!c)return;g=1;S.board[i]=null;compact(S.board)}
 G.en+=g;G.sd=true;G.sac=false;G.sel=null;
 G.lg.push('Bạn hiến tế '+c.n+' → +'+g+' ⚡');
 sfx('item');render();
}
