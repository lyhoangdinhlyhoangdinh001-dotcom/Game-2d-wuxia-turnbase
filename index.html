<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tam Quốc Lục — Bản đồ & Luyện Cấp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Noto+Serif:wght@600;700&display=swap">
<style>
:root{--bg:#e8eee9;--panel:#f6f9f6;--ink:#1d2a28;--mute:#5d6e6a;--line:#c3d0c9;--jade:#2d6a5c;--seal:#a32a2b;--gold:#8a6a1c;--sel:#d6e6dd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c1b;--panel:#1a2827;--ink:#dfe8e2;--mute:#93a69f;--line:#2f4440;--jade:#5fb39e;--seal:#e0605a;--gold:#d6ad4c;--sel:#24403b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121c1b;--panel:#1a2827;--ink:#dfe8e2;--mute:#93a69f;--line:#2f4440;--jade:#5fb39e;--seal:#e0605a;--gold:#d6ad4c;--sel:#24403b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Serif",Georgia,serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;max-width:1100px;margin:auto}
aside{border-right:1px solid var(--line);padding:16px 12px;background:var(--panel);overflow:auto}
main{padding:18px 20px 40px;min-width:0}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px;color:var(--mute);font-size:13px}
.crumb button{background:none;border:0;padding:2px 4px;color:var(--jade);text-decoration:underline}
.crumb b{color:var(--ink);font-weight:500}
h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 16px;max-width:62ch}
.stat{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mute);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:block;width:100%}
.card:hover{border-color:var(--jade)}
.card h3{font-size:16px;margin-bottom:2px}
.card small{color:var(--mute)}
.ico{font-size:22px;display:block;margin-bottom:4px}
.map{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.rg{cursor:pointer}
.rg rect{fill:var(--sel);stroke:var(--line);stroke-width:1.5}
.rg:hover rect,.rg:focus rect{stroke:var(--jade);stroke-width:2.5}
.rg text{fill:var(--ink);font-family:"Noto Serif",serif;font-size:15px;font-weight:600;text-anchor:middle;pointer-events:none}
.rg .n{font-family:"Be Vietnam Pro",sans-serif;font-weight:400;font-size:11px;fill:var(--mute)}
.npc{display:flex;gap:10px;align-items:center}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sel);border:2px solid var(--jade);font-family:"Noto Serif",serif;font-weight:700;color:var(--jade)}
.av.boss{border-color:var(--seal);color:var(--seal)}
.av.mob{border-color:var(--gold);color:var(--gold)}
.tag{font-size:12px;color:var(--mute)}
.tag.boss{color:var(--seal)}
.tag.mob{color:var(--gold)}
.met .av{background:var(--jade);color:var(--panel)}
.dlg{margin-top:18px;border:1px solid var(--gold);border-radius:6px;padding:14px 16px;background:var(--panel)}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg p{margin:0 0 10px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border:1px solid var(--jade);border-radius:6px;background:none}
.btn:hover{background:var(--sel)}
.btn[disabled]{opacity:.5;cursor:not-allowed;border-color:var(--line)}
.tree,.tree ul{list-style:none;margin:0;padding-left:14px}
.tree{padding-left:0}
.tree li{margin:1px 0}
.tree button{background:none;border:0;padding:2px 4px;text-align:left;border-radius:4px;font-size:13px;width:100%}
.tree button:hover{background:var(--sel)}
.tree .cur>button{background:var(--sel);font-weight:500;color:var(--seal)}
.tree .lf{color:var(--mute);font-size:12px;padding:0 4px}
.tit{font-size:12px;color:var(--mute);margin:0 0 8px;padding:0 4px}
.strong{font-weight:500}
.card.on{border-color:var(--seal);background:var(--sel)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--jade)}
.bar.e i{background:var(--seal)}
.pet{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;font-size:13px;border-radius:4px;cursor:pointer}.pet:hover{background:var(--sel)}
.app:has(aside:empty){grid-template-columns:1fr}aside:empty{display:none}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}}
</style>
</head>
<body>
<div class="app"><aside id="tree" aria-label="Cây thư mục bản đồ"></aside><main id="main"></main></div>
<script>
const D=[
["Lương Châu","Vùng biên ải phía tây. Thích hợp cho tân thủ luyện cấp Lv 1-5.",20,20,[
  ["Thôn Ký Huyện","Bãi cày cấp lý tưởng cho người mới bắt đầu.",[["Bãi Cỏ Ven Đường",["Thỏ Rừng Tinh Ma*","Sói Rừng Dã Ngoại*","Sơn Tặc Tập Sự*"]],["Nhà Trưởng Làng",["Vi Khang"]]],[]]
]],
["U Châu","Phương bắc; có Trác Quận và bãi train quái thấp.",270,20,[
  ["Trác Quận","Nơi khởi nguồn thế lực.",[["Quảng Trường Trác Quận",["Tiểu Gia Cát","Vân Du đạo sĩ!","Lưu Mang*"]],["Ngôi nhà nhỏ",["Châu Tịnh"]]],[]]
]],
["Quan Trung","Đất của Đổng Trác. Quái dã ngoại cấp trung.",20,95,[
 ["Trường An","Thành của Đổng Trác.",[["Nhà Quan (Quan Phủ)",["Đổng Trác!","Lữ Bố!","Lý Nho!","Đổng Văn!","Phùng Phương!","Hạ Mậu!"]],["Nhà nhỏ đường phố",["Điêu Thuyền+"]],["Bãi Tập Quân Sự",["Tân Binh Tây Lương*","Kỵ Binh Tuần Tra*"]]],["Hàn Toại","Bàng Đức","Đổng Trác"]],
 ["Lạc Dương","Khởi điểm chuỗi quest Đổng Trác.",[["Quan Phủ Lạc Dương",["Đổng Trác"]],["Nhà Trọ",["Ông Thợ Lão"]],["Rừng Đào Hoang Phế",["Quái Thú Hoang Dã*"]]],["Lý Dư","Đổng Việt"]]]],
["Việt Châu","Còn gọi Duyện Châu; đất của Tào Tháo.",145,95,[
 ["Hứa Xương","Kinh đô nhà Tào.",[["Hoàng Cung",["Hoàng Đế","Tào Tháo","Đổng Chiêu"]],["Khu Huấn Luyện",["Quân Sĩ Hứa Xương*"]]],["Tào Nhân","Hạ Hầu Đôn","Hạ Hầu Uyên","Nhạc Tiến","Chung Diêu","Vương Xán","Lữ Kiền"]],
 ["Trần Lưu","",[["Cửa Thành",["Hạ Hầu Đôn"]]],["Trương Xuân Hoa"]]]],
["Từ Châu","Vùng chiến địa.",270,95,[["Thành Từ Châu","",[["Quan Phủ Từ Châu",["Thiết Giáp Quân!"]],["Vùng Đất Lầy",["Đầm Lầy Yêu Quái*"]]],[]]]],
["Ích Châu","Một trong tam phân thiên hạ.",20,170,[["Thành Đô","",[["Quan Phủ Thành Đô",["Lưu Ba","Gia Cát Lượng"]],["Rừng Sâu Ích Châu",["Mãnh Hổ Núi Sâu*"]]],["Lưu Ba","Hứa Tĩnh","Đặng Chi","Tần Tất"]]]],
["Dự Châu","Nơi giao tranh các thế lực.",145,170,[
 ["Diệp Thành","Thành của Viên Thiệu.",[["Hoàng Cung Diệp Thành",["Viên Thiệu!","Văn Xú!","Nhan Lương!"]]],[]],
 ["Thành Bình Nguyên","",[],["Hứa Thiệu"]]]],
["Dương Châu","Đất của Tôn Quyền.",270,170,[["Kiến Nghiệp","",[["Phủ Tôn Quyền",["Tôn Quyền","Chu Du?","Cam Ninh?"]]],[]]]],
["Kinh Châu","Vùng chiến lược trọng yếu.",145,245,[["Tương Dương","",[["Khách Sạn Tương Dương",["Điếm tiểu nhị"]],["Rừng Ven Sông",["Thủy Quái Sông Lớn*"]]],[]]]]
];

const ICON={"Hoàng":"🏯","Quan":"🏛️","Khách":"🏮","Lò":"🔨","Vườn":"🌸","Thành":"🚪","Quán":"🍵","Nhà":"🏠","Điểm":"⚔️","Ngọc":"💎","Tiền":"💰","Phủ":"🏯","Thụ":"🗼","Cửa":"🚪","Ngôi":"🏠","Quảng":"⛲","Bãi":"🌾","Khu":"🛡️","Rừng":"🌲","Vùng":"🌊"};
const $=s=>document.querySelector(s);
const S={c:null,t:null,h:null,npc:null};
const met=new Set();
let total=0;D.forEach(c=>c[4].forEach(t=>t[2].forEach(h=>total+=h[1].length)));
const parse=n=>{const m=n.match(/[!+?*]$/);return{name:m?n.slice(0,-1):n,f:m?m[0]:""}};
const ico=n=>ICON[n.split(" ")[0]]||"🏠";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(c,t,h){S.msg=null;S.c=c;S.t=t;S.h=h;S.npc=null;render();window.scrollTo(0,0)}

function crumbs(){
  let a=[`<button data-go="">Thế giới</button>`];
  if(S.c!==null){const c=D[S.c];a.push(S.t===null?`<b>${c[0]}</b>`:`<button data-go="${S.c}">${c[0]}</button>`);
    if(S.t!==null){const t=c[4][S.t];a.push(S.h===null?`<b>${t[0]}</b>`:`<button data-go="${S.c},${S.t}">${t[0]}</button>`);
      if(S.h!==null)a.push(`<b>${t[2][S.h][0]}</b>`)}}
  return `<nav class="crumb">${a.join(" / ")}</nav>`;
}

function world(){
  const reg=D.map((c,i)=>{const n=c[4].length;return `<g class="rg" tabindex="0" role="button" aria-label="${c[0]}" data-go="${i}"><rect x="${c[2]}" y="${c[3]}" width="110" height="60" rx="6"/><text x="${c[2]+55}" y="${c[3]+28}">${c[0]}</text><text class="n" x="${c[2]+55}" y="${c[3]+46}">${n} khu vực</text></g>`}).join("");
  return `<h2>Bản đồ Thế giới Tam Quốc Lục</h2>
  <p class="sub">🌟 <b>Hướng dẫn tân thủ:</b> Chọn <b>Lương Châu</b> hoặc <b>U Châu</b>, vào <i>Thôn Ký Huyện</i> để đánh quái dã ngoại (có dấu *) nhằm luyện cấp Lv 1 dễ dàng!</p>
  <p><button class="btn" style="background:var(--jade);color:#fff;font-weight:bold;margin-bottom:10px" data-train-quick>⚡ Luyện Cấp Nhanh (Gặp Quái Tân Thủ)</button></p>
  <svg class="map" viewBox="0 0 400 315" role="group" aria-label="Bản đồ các châu">${reg}</svg>`;
}

function chau(){
  const c=D[S.c];
  return `<h2>${c[0]}</h2><p class="sub">${c[1]||"&nbsp;"}</p>
  <p><button class="btn" style="background:var(--jade);color:#fff;font-weight:bold;margin-bottom:10px" data-train-quick>⚡ Luyện Cấp Tại ${c[0]}</button></p>
  <div class="grid">${c[4].map((t,i)=>`<button class="card" data-go="${S.c},${i}"><span class="ico">🏰</span><h3>${t[0]}</h3><small>${t[2].length} địa điểm · ${t[2].reduce((s,h)=>s+h[1].length,0)} mục tiêu</small></button>`).join("")}</div>`;
}

function thanh(){
  const t=D[S.c][4][S.t];
  const rec=t[3].length?`<p class="sub"><span class="strong">Tướng có thể chiêu mộ ở đây:</span> ${t[3].join(", ")}.</p>`:"";
  const hs=t[2].length?`<div class="grid">${t[2].map((h,i)=>`<button class="card" data-go="${S.c},${S.t},${i}"><span class="ico">${ico(h[0])}</span><h3>${h[0]}</h3><small>${h[1].length?h[1].length+" đối tượng":"Trống"}</small></button>`).join("")}</div>`:`<p class="sub">Chưa có dữ liệu địa điểm.</p>`;
  return `<h2>${t[0]}</h2><p class="sub">${t[1]||"&nbsp;"}</p>${rec}${hs}`;
}

function nha(){
  const h=D[S.c][4][S.t][2][S.h];
  const list=h[1].length?`<div class="grid">${h[1].map((n,i)=>{const p=parse(n);const k=S.c+"-"+S.t+"-"+S.h+"-"+i;return `<button class="card npc ${met.has(k)?"met":""}" data-npc="${i}"><span class="av ${p.f==="!"?"boss":p.f==="*?"?"mob":""}">${p.name.trim().split(" ").pop()[0]}</span><span><h3>${esc(p.name)}</h3><span class="tag ${p.f==="!"?"boss":p.f==="*?"?"mob":""}">${p.f==="!"?"Đối thủ Boss":p.f==="*?"?"Quái Dã Ngoại (Train Lv)":p.f==="+"?"Có thể gia nhập":"NPC"}</span></span></button>`}).join("")}</div>`:`<p class="sub">Khu vực trống.</p>`;
  let d="";
  if(S.npc!==null){const p=parse(h[1][S.npc]);d=`<div class="dlg" role="status"><h3>${esc(p.name)}</h3><p>${S.msg&&S.msg.i===S.npc?S.msg.t:`${esc(p.name)} ${p.f==="*?"?"đang xuất hiện dã ngoại, sẵn sàng giao chiến để nhận Kinh Nghiệm.":p.f==="!"?"chặn đường thách đấu.":"đứng trước mặt bạn."}`}</p><div class="row"><button class="btn" data-act="talk">Nói chuyện / Nhận nhiệm vụ</button><button class="btn" data-act="fight">Giao chiến (Chiến đấu)</button><button class="btn" data-close>Đóng</button></div></div>`}
  return `<h2>${h[0]}</h2><p class="sub">${D[S.c][4][S.t][0]}, ${D[S.c][0]}.</p>${list}${d}`;
}

function tree(){
  const li=(label,cur,go,kids)=>`<li class="${cur?"cur":""}"><button data-go="${go}">${label}</button>${kids||""}</li>`;
  return `<p class="tit">Cây thư mục · đã gặp ${met.size}/${total} NPC</p><ul class="tree">`+li("🌏 Thế giới",S.c===null,"",
    "<ul>"+D.map((c,ci)=>{
      const open=S.c===ci;
      let k="";
      if(open)k="<ul>"+c[4].map((t,ti)=>{
        const to=S.t===ti;
        let kk="";
        if(to)kk="<ul>"+t[2].map((h,hi)=>li(h[0],S.h===hi,`${ci},${ti},${hi}`,S.h===hi?"<ul>"+h[1].map(n=>`<li class="lf">• ${esc(parse(n).name)}</li>`).join("")+"</ul>":"")).join("")+"</ul>";
        return li(t[0],to&&S.h===null,`${ci},${ti}`,kk)}).join("")+"</ul>";
      return li(c[0],open&&S.t===null,String(ci),k)}).join("")+"</ul>")+"</ul>";
}

function render(){
  let v;
  if(!P)v=creator();else if(B)v=battle();else if(S.c===null)v=world();else if(S.t===null)v=chau();else if(S.h===null)v=thanh();else v=nha();
  $("#main").innerHTML=(P&&!B?crumbs():"")+v;
  $("#tree").innerHTML=P?party()+`<p style="margin-top:14px"><button class="btn" data-reset>Chơi mới (xóa save)</button></p><p class="tag">Tự động lưu trên trình duyệt.</p>`:"";
  if(P&&(!B||B.over))save();
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){const a=g.dataset.go===""?[]:g.dataset.go.split(",").map(Number);go(a.length?a[0]:null,a.length>1?a[1]:null,a.length>2?a[2]:null);return}
  const n=e.target.closest("[data-npc]");
  if(n){S.msg=null;S.npc=+n.dataset.npc;met.add(S.c+"-"+S.t+"-"+S.h+"-"+S.npc);render();return}
  if(e.target.closest("[data-close]")){S.npc=null;render()}
  if(e.target.closest("[data-train-quick]")){startQuickTrain();return}
  if(e.target.closest("[data-rest]")){restTeam();return}
});

document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".rg")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});

let P=null,B=null,sel="Mãnh tướng";const pets=[],quests=new Set(),team=new Set();
const act=()=>pets.filter(p=>team.has(p.name));
const need=o=>o.lv*30,xpOf=e=>Math.round(e.lv*10*(e.boss?1.5:e.mob?.8:1));

function gain(xp,L){
  [P,...act()].forEach(o=>{
    o.exp=(o.exp||0)+xp;
    while(o.exp>=need(o)&&o.lv<199){
      o.exp-=need(o);o.lv++;calc(o);
      L.push(`🎉 ${esc(o.name)} đã lên cấp ${o.lv}!`);
    }
  });
  L.push(`Nhận được tổng cộng ${xp} điểm kinh nghiệm.`);
}

const addPet=p=>{pets.push(p);if(team.size<3)team.add(p.name)};

const AR={W:[38,2,8,17,5,30],T:[12,2,38,35,5,8],M:[4,40,6,15,25,10],A:[28,5,6,13,8,40],B:[20,15,15,20,15,15],S:[5,30,12,18,30,5]};
const AK=Object.keys(AR),CW={"Mãnh tướng":"W","Mưu sĩ":"M","Cung thủ":"A","Đạo sĩ":"S"};
const DS={W:"Công và Nhanh cao",T:"Máu và Thủ cao (tank)",M:"Trí và SP cao (pháp sư)",A:"Nhanh và Công cao",B:"Cân bằng",S:"Trí và SP cao, hỗ trợ"};

const NP={
  "Lữ Bố":[150,"W"],"Gia Cát Lượng":[145,"M"],"Tào Tháo":[140,"B"],"Chu Du":[125,"M"],"Tôn Quyền":[120,"B"],"Đổng Trác":[115,"T"],"Viên Thiệu":[110,"B"],"Hạ Hầu Đôn":[105,"W"],"Hứa Chu":[105,"T"],"Bàng Đức":[100,"W"],"Hạ Hầu Uyên":[100,"A"],"Cam Ninh":[100,"A"],"Nhan Lương":[98,"W"],"Văn Xú":[96,"W"],"Tào Nhân":[95,"T"],"Dư Cấm":[90,"T"],"Lý Nho":[85,"M"],"Nhạc Tiến":[80,"W"],"Hàn Toại":[75,"B"],"Chung Diêu":[70,"M"],"Phùng Kỷ":[65,"M"],"Điêu Thuyền":[60,"S"],"Viên Đàm":[60,"B"],"Hạ Mậu":[55,"W"],"Hoàng Khôi":[55,"W"],"Viên Thượng":[55,"B"],"Lưu Ba":[50,"M"],"Viên Hy":[50,"B"],"Hứa Thiệu":[45,"M"],"Đổng Văn":[45,"W"],"Tiểu Gia Cát":[40,"M"],"Lưu Kỳ":[35,"S"],
  // Quái train level dã ngoại
  "Thỏ Rừng Tinh Ma":[1,"W"],"Sói Rừng Dã Ngoại":[2,"W"],"Sơn Tặc Tập Sự":[3,"W"],"Lưu Mang":[3,"A"],"Tân Binh Tây Lương":[5,"W"],"Kỵ Binh Tuần Tra":[6,"A"],"Quái Thú Hoang Dã":[4,"T"],"Quân Sĩ Hứa Xương":[7,"W"],"Đầm Lầy Yêu Quái":[6,"M"],"Mãnh Hổ Núi Sâu":[8,"W"],"Thủy Quái Sông Lớn":[7,"M"]
};

const ns=(n,boss,mob)=>{
  const h=hs(n);
  const q=NP[n]||[1+h%5,AK[h%6]];
  const o={name:n,boss:!!boss,mob:!!mob,lv:q[0],exp:0,w:AR[q[1]],sk:(ST[n]||[])[3]||"Đòn Thường"};
  calc(o);
  return o;
};

function calc(o){
  const s=o.w.map(x=>Math.round(o.lv*2*x/100));
  const mh=50+s[3]*6+o.lv*2;
  if(o===P)o.max=mh;else o.hp=mh;
  o.atk=6+Math.round(s[0]*1.2);
  o.int=6+Math.round(s[1]*1.2);
  o.def=s[2];
  o.agi=s[5];
  o.msp=20+s[4]*2;
  o.mg=s[1]>s[0];
}

const pw=o=>o.mg?o.int:o.atk,hit=d=>Math.random()>=d.agi/(d.agi+200);

function eat(L){
  const e=B.e,al=[P,...B.t.filter(p=>p.cur>0)],g=al[Math.floor(Math.random()*al.length)];
  if(!hit(g)){L.push(`${esc(g.name)} né đòn của ${esc(e.name)}!`);return}
  const x=dm(pw(e),g.def*(e.mg?.5:1));
  if(g===P)P.hp-=x;else g.cur=Math.max(0,g.cur-x);
  L.push(`${esc(e.name)} tấn công ${esc(g.name)}, gây ${x} sát thương${g!==P&&!g.cur?" (đã gục)":""}.`);
  if(P.hp<=0){P.hp=0;B.over="lose";L.push("Bạn đã gục ngã. Hãy nghỉ ngơi hồi phục rồi thử lại.")}
}

const K="tqluc_save_v2";
const hasSave=()=>{try{return !!localStorage.getItem(K)}catch(_){return false}};
function save(){try{localStorage.setItem(K,JSON.stringify({P,pets,team:[...team],quests:[...quests],met:[...met],loc:[S.c,S.t,S.h]}))}catch(_){}}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(K));
    if(!d||!d.P)return;
    P=d.P;pets.length=0;pets.push(...d.pets);
    P.lv=P.lv||1;P.exp=P.exp||0;
    pets.forEach(p=>{p.lv=p.lv||1;p.exp=p.exp||0});
    P.w=P.w||AR[CW[P.cls]];calc(P);
    pets.forEach(p=>{p.w=p.w||AR.B;calc(p)});
    team.clear();d.team.forEach(x=>team.add(x));
    quests.clear();d.quests.forEach(x=>quests.add(x));
    met.clear();d.met.forEach(x=>met.add(x));
    [S.c,S.t,S.h]=d.loc;
    if(S.c!==null&&!D[S.c])S.c=S.t=S.h=null;
    S.npc=null;P.hp=P.max;render();
  }catch(_){}
}

const ST={
  "Tào Tháo":[150,16,7,"Gian Hùng"],"Tào Nhân":[120,14,9,"Thủ Thành"],"Hạ Hầu Đôn":[135,17,7,"Độc Nhãn"],"Hạ Hầu Uyên":[110,16,5,"Thần Tốc"],"Nhạc Tiến":[105,14,6,"Tiên Phong"],"Chung Diêu":[80,9,4,"Thư Pháp"],"Dư Cấm":[115,13,8,"Trị Quân"],"Hứa Chu":[125,16,6,"Hổ Si"],"Đổng Trác":[160,18,8,"Bạo Ngược"],"Lữ Bố":[170,22,7,"Phương Thiên Kích"],"Điêu Thuyền":[70,8,3,"Liên Hoàn Kế"],"Lý Nho":[75,12,3,"Độc Kế"],"Bàng Đức":[125,17,7,"Liều Chết"],"Hàn Toại":[105,13,6,"Cường Binh"],"Viên Thiệu":[140,14,7,"Danh Môn"],"Nhan Lương":[130,18,5,"Dũng Mãnh"],"Văn Xú":[128,17,5,"Dũng Mãnh"],"Gia Cát Lượng":[90,20,4,"Không Thành Kế"],"Lưu Ba":[75,9,4,"Chính Sách"],"Tôn Quyền":[135,15,7,"Giữ Giang Đông"],"Chu Du":[95,19,4,"Hỏa Công"],"Cam Ninh":[120,17,6,"Cẩm Phàm Tặc"],"Tiểu Gia Cát":[60,13,2,"Mưu Nhỏ"],"Hứa Thiệu":[65,9,3,"Bình Nhân"],"Hoàng Khôi":[100,12,5,"Đòn Thường"],
  "Thỏ Rừng Tinh Ma":[40,8,2,"Cắn Nhẹ"],"Sói Rừng Dã Ngoại":[50,11,3,"Vồ Mồi"],"Sơn Tặc Tập Sự":[55,12,4,"Chém Trộm"],"Lưu Mang":[48,10,3,"Ném Đá"],"Tân Binh Tây Lương":[70,14,6,"Giáo Kích"],"Kỵ Binh Tuần Tra":[85,16,7,"Xung Phong"],"Quái Thú Hoang Dã":[65,13,5,"Cào Xé"],"Quân Sĩ Hứa Xương":[90,17,8,"Phòng Thủ"],"Đầm Lầy Yêu Quái":[75,15,5,"Đất Lún"],"Mãnh Hổ Núi Sâu":[110,20,8,"Gầm Thét"],"Thủy Quái Sông Lớn":[95,18,6,"Phun Nước"]
};

const CL={"Mãnh tướng":[120,14,6,"Chém Mạnh"],"Mưu sĩ":[80,18,3,"Hỏa Công"],"Cung thủ":[95,16,4,"Xạ Tiễn"],"Đạo sĩ":[100,11,5,"Phù Chú"]};
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);
const dm=(a,d)=>Math.max(1,Math.round(a*(.8+Math.random()*.4))-d);
const cur=()=>parse(D[S.c][4][S.t][2][S.h][1][S.npc]);
const chance=()=>{const e=B.e,r=e.cur/e.hp;return r>.5?0:Math.min(.95,(1-r*1.4)*(e.boss?.6:1)*Math.max(.5,1-.05*Math.max(0,e.lv-P.lv)))};

function creator(){
  return `<h2>Tạo nhân vật chính</h2>
  <p class="sub">Đặt tên và chọn lớp. Khi bắt đầu, bạn sẽ được <b>tặng sẵn 3 Pet Lv 1</b> trong đội hình để chiến đấu ngay lập tức!</p>
  <p><input id="nm" maxlength="20" value="Vô Danh" aria-label="Tên nhân vật" style="padding:8px;font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px"></p>
  <div class="grid">${Object.keys(CL).map(k=>`<button class="card ${k===sel?"on":""}" data-cls="${k}"><h3>${k}</h3><small>${DS[CW[k]]}<br>Kế: ${CL[k][3]}</small></button>`).join("")}</div>
  <p class="row" style="margin-top:16px"><button class="btn" style="background:var(--jade);color:#fff;font-weight:bold" data-start>Bắt đầu du hành</button>${hasSave()?`<button class="btn" data-load>Tiếp tục game đã lưu</button>`:""}</p>`;
}

function party(){
  return `<p class="tit">${esc(P.name)} · ${P.cls}</p>
  <p class="tag" style="padding:0 4px;margin:0 0 12px">Cấp ${P.lv} · KN ${P.exp}/${need(P)}<br>HP ${P.hp}/${P.max} · SP ${P.msp}<br>Công ${P.atk} · Trí ${P.int}<br>Thủ ${P.def} · Nhanh ${P.agi}</p>
  <p><button class="btn" style="width:100%;font-size:12px;padding:5px;background:var(--jade);color:#fff" data-rest>🏥 Nghỉ Ngơi (Hồi Phục)</button></p>
  <p class="tit" style="margin-top:10px">Đội hình ra trận (${team.size}/3)</p>
  ${pets.length?pets.map(p=>`<label class="pet"><input type="checkbox" data-pet="${esc(p.name)}" ${team.has(p.name)?"checked":""} ${B?"disabled":""}><span><b>${esc(p.name)}</b> Lv ${p.lv||1}<br><span class="tag">HP ${p.hp}/${p.max||p.hp} · Công ${p.atk} · Thủ ${p.def}</span></span></label>`).join(""):`<p class="tag">Chưa có đồng đội.</p>`}
  <p class="tag" style="padding:0 4px;margin:0">${quests.size?`<br>Nhiệm vụ: ${[...quests].map(esc).join(", ")}`:""}</p>`;
}

function battle(){
  const e=B.e,pc=Math.round(chance()*100);
  const bar=(n,c,m,k)=>`<div><b>${esc(n)}</b> ${c}/${m}<div class="bar ${k||""}"><i style="width:${Math.max(0,c/m*100)}%"></i></div></div>`;
  return `<h2>Chiến đấu</h2>${bar(e.name+" Lv "+e.lv+(e.boss?" (Boss)":e.mob?" (Quái Dã Ngoại)":""),e.cur,e.hp,"e")}${bar(P.name+" Lv "+P.lv,P.hp,P.max)}${B.t.map(p=>bar(p.name+(p.cur?"":" (gục)"),p.cur,p.max||p.hp)).join("")}<div class="dlg">${B.log.slice(-8).map(l=>`<p style="margin:0 0 4px">${l}</p>`).join("")}</div>`+
  (B.over?`<p><button class="btn" data-b="end">Quay lại</button></p>`:
  `<div class="row" style="margin-top:12px"><button class="btn" data-b="atk">Đánh thường</button><button class="btn" data-b="skill" ${B.sp>=10?"":"disabled"}>${P.sk} (SP ${B.sp})</button><button class="btn" data-b="catch">Bắt (${pc}%)</button><button class="btn" data-b="flee">Rút lui</button></div>
  <p class="tag">💡 Đánh bại quái dã ngoại có dấu (*) giúp bạn luyện cấp nhanh chóng từ Lv 1!</p>`);
}

function bat(k){
  const e=B.e,L=B.log;
  if(k==="end"||k==="flee"){B=null;render();return}
  if(k==="catch"){
    const c=chance();
    if(!c||e.mob){L.push("Không thể bắt quái dã ngoại hoặc quái còn quá khỏe!");render();return}
    if(Math.random()<c){
      B.over="win";
      if(pets.some(p=>p.name===e.name))L.push(`${esc(e.name)} đã có trong đội.`);
      else{addPet(e);L.push(`🎉 Bắt thành công! ${esc(e.name)} đã gia nhập đội.`);}
      gain(Math.ceil(xpOf(e)/2),L);render();return;
    }
    L.push("Bắt thất bại!");
  }else{
    if(k==="skill"&&B.sp<10){L.push("Không đủ SP.");render();return}
    const sk=k==="skill";if(sk)B.sp-=10;
    if(!hit(e))L.push(`${esc(e.name)} né tránh đòn của ${esc(P.name)}!`);
    else{
      const d=dm((sk?1.8:1)*(sk?pw(P):Math.max(P.atk,P.int*.6)),e.def*(P.mg?.5:1));
      e.cur-=d;L.push(`${esc(P.name)} ${sk?"dùng "+esc(P.sk)+", gây":"gây"} ${d} sát thương.`);
    }
    B.t.filter(p=>p.cur>0).forEach(p=>{
      const s=Math.random()<.3,x=dm((s?1.6:1)*pw(p),e.def*(p.mg?.5:1));
      e.cur-=x;L.push(`${esc(p.name)} ${s?"dùng "+esc(p.sk)+", gây":"gây"} ${x} sát thương.`);
    });
  }
  if(e.cur<=0){
    e.cur=0;B.over="win";L.push(`🏆 Đã hạ gục ${esc(e.name)}!`);
    gain(xpOf(e),L);
    quests.forEach(q=>{if(!pets.some(p=>p.name===q)){addPet(ns(q,false,false));L.push(`Hoàn thành nhiệm vụ: ${esc(q)} gia nhập đội!`)}});
    quests.clear();
  }else{eat(L);}
  render();
}

function startQuickTrain(){
  const mobList=["Thỏ Rừng Tinh Ma","Sói Rừng Dã Ngoại","Sơn Tặc Tập Sự","Lưu Mang","Tân Binh Tây Lương"];
  const randMob=mobList[Math.floor(Math.random()*mobList.length)];
  const n=ns(randMob,false,true);
  n.cur=n.hp;
  P.hp=P.max;
  pets.forEach(p=>p.cur=p.max||p.hp);
  B={e:n,t:act().map(x=>({...x,cur:x.max||x.hp})),sp:P.msp,log:[`⚠️ ${esc(n.name)} (Lv ${n.lv}) xuất hiện khi đang luyện cấp dã ngoại!`]};
  render();
}

function restTeam(){
  P.hp=P.max;
  pets.forEach(p=>p.hp=p.max||p.hp);
  render();
}

document.addEventListener("change",e=>{
  const c=e.target.closest("[data-pet]");
  if(!c)return;
  const n=c.dataset.pet;
  if(c.checked){if(team.size>=3){c.checked=false;return}team.add(n)}else team.delete(n);
  render();
});

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cls]");
  if(c){sel=c.dataset.cls;document.querySelectorAll("[data-cls]").forEach(b=>b.classList.toggle("on",b===c));return}
  if(e.target.closest("[data-load]")){load();return}
  const r=e.target.closest("[data-reset]");
  if(r){
    if(r.dataset.sure){try{localStorage.removeItem(K)}catch(_){}P=null;B=null;pets.length=0;team.clear();quests.clear();met.clear();S.c=S.t=S.h=S.npc=null;render()}
    else{r.dataset.sure=1;r.textContent="Bấm lần nữa xác nhận"}
    return;
  }
  if(e.target.closest("[data-start]")){
    P={name:($("#nm").value.trim()||"Vô Danh"),cls:sel,lv:1,exp:0,w:AR[CW[sel]],sk:CL[sel][3]};
    calc(P);P.hp=P.max;
    
    // Tặng sẵn 3 Pet tân thủ Lv 1 vào đội hình
    pets.length=0;team.clear();
    const starterPets=["Tiểu Gia Cát","Tiểu Mãnh Hổ","Tiểu Điêu Thuyền"];
    starterPets.forEach(name=>{
      const p={name,boss:false,mob:false,lv:1,exp:0,w:AR.B,sk:"Hỗ Trợ"};
      calc(p);p.hp=p.max;
      pets.push(p);
      team.add(name);
    });

    render();
    return;
  }
  const b=e.target.closest("[data-b]");if(b&&B){bat(b.dataset.b);return}
  const a=e.target.closest("[data-act]");if(!a)return;const p=cur();
  if(a.dataset.act==="talk"){
    let t;
    if(pets.some(x=>x.name===p.name))t=`${esc(p.name)} đã ở trong đội của bạn.`;
    else if(quests.has(p.name))t="Nhiệm vụ đang chờ: hãy thắng một trận chiến bất kỳ.";
    else{quests.add(p.name);t=`Nhận nhiệm vụ: thắng một trận chiến bất kỳ, ${esc(p.name)} sẽ gia nhập đội!`;}
    S.msg={i:S.npc,t};render();
  }else{
    const isMob=p.f==="*";
    const n=ns(p.name,p.f==="!",isMob);
    n.cur=n.hp;P.hp=P.max;
    pets.forEach(pet=>pet.cur=pet.max||pet.hp);
    B={e:n,t:act().map(x=>({...x,cur:x.max||x.hp})),sp:P.msp,log:[`${esc(p.name)} xuất hiện!`]};
    if(n.agi>P.agi){B.log.push(`${esc(n.name)} nhanh hơn và ra đòn trước!`);eat(B.log);}
    render();
  }
});
render();
</script>
