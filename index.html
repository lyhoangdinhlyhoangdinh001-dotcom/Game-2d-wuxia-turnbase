const SFX={pick:()=>tone(660,.08,'triangle',.1),play:()=>{tone(300,.12,'triangle',.15,0,500);noise(.08,.1,3000)},item:()=>{tone(700,.1,'sine',.12);tone(1050,.14,'sine',.1,.08)},sword:()=>{noise(.12,.18,5000);tone(220,.1,'sawtooth',.08,0,110)},bow:()=>{tone(900,.14,'triangle',.1,0,300);noise(.06,.08,6000,.1)},hit:()=>{noise(.15,.3,900);tone(140,.15,'square',.1,0,60)},shield:()=>{tone(1200,.1,'square',.07);tone(800,.18,'triangle',.1,.03)},block:()=>{tone(500,.08,'square',.1);noise(.05,.12,4000)},thorn:()=>{tone(1400,.06,'sawtooth',.06);tone(1000,.08,'sawtooth',.06,.05)},heal:()=>[523,659,784].forEach((f,i)=>tone(f,.18,'sine',.1,i*.09)),turn:()=>{tone(392,.15,'triangle',.12);tone(523,.2,'triangle',.12,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.14)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.35,'sawtooth',.08,i*.18)),die:()=>{tone(200,.3,'sawtooth',.1,0,50);noise(.2,.2,600)}};
const sfx=k=>{try{SFX[k]()}catch(e){}};
let G;
const DM=[0,0,1,2,3,4,5,6],DI=[0,0,1,1,2,3,4,4];
const mk=(y,L,a)=>shuf(a.map(i=>({y,...L[i]})));
const draw=(S,y)=>(y=='m'?S.dm:S.di).pop();
const newSide=()=>{const S={dm:mk('m',M,DM),di:mk('i',I,DI),board:[null,null,null],pl:false};S.hand=[draw(S,'m'),draw(S,'m'),draw(S,'i'),draw(S,'i')];return S};
const inst=c=>({n:c.n,e:c.e,a:c.a,ba:c.a,h:c.h,mh:c.h,s:c.s||0,t:c.t||0,b:0,sw:0,r:!!c.r,mg:!!c.mg,img:c.img||''});
function useCard(S,hi,ti){const c=S.hand[hi],m=S.board[ti];if(c.y=='m'){let e=ti;while(S.board[e])e++;for(let j=e;j>ti;j--)S.board[j]=S.board[j-1];S.board[ti]=inst(c);compact(S.board)}else if(c.k=='h')m.h=Math.min(m.mh,m.h+c.v);else{const key=c.k=='a'&&m.r?'sw':c.k;if(c.q=='e'&&m.eq)m[m.eq.k]-=m.eq.v;m[key]+=c.v;if(c.q=='e')m.eq={e:c.e,n:c.n,k:key,v:c.v,img:c.img}}{const n=draw(S,c.y);if(n)S.hand[hi]=n;else S.hand[hi]=null}if(c.y=='m')S.pl=true}
const lost=k=>{const S=G[k];return !S.board.some(Boolean)&&!S.hand.some(c=>c&&c.y=='m')&&!S.dm.length};
function start(){G={p:newSide(),o:newSide(),en:3,oen:3,turn:1,sel:null,sac:false,sd:false,busy:false,lg:['— Lượt 1 —']};$('#ov').style.display='none';$('#lgp').style.display='none';$('#ins').style.display='none';render()}
const valid=i=>{const c=G.p.hand[G.sel];return c&&c.c<=G.en&&(c.y=='m'?(n=>n>=0&&i<=n)(G.p.board.findIndex(x=>!x)):!!G.p.board[i]&&!(c.k=='b'&&G.p.board[i].b>0))};
const sk=m=>[['t','🌵'],['b','<em class="bi"></em>']].filter(([k])=>m[k]>0).map(([k,e])=>`<u class="sk">${e}${k=='b'?'':`<i>${m[k]}</i>`}</u>`).join('');
const hx=c=>{const l=[['s','<em class="si"></em>'],['t','🌵'],['b','<em class="bi"></em>']].filter(([k])=>c[k]>0);return`<span class="hxs">${l.slice(0,3).map(([k,e])=>`<em class="hx sk">${e}${k=='b'?'':`<i>${c[k]}</i>`}</em>`).join('')}</span>`};
const hp=i=>i==0?'':i==2?'gp':'ov';
function render(){
 for(const k of['o','p']){const el=$('#'+k);el.innerHTML='';[1,0,2].forEach(i=>{const m=G[k].board[i],d=document.createElement('div');d.className='slot c'+i+' '+k;d.dataset.s=k;d.dataset.i=i;
  if(k=='p'&&G.sel!=null&&valid(i))d.classList.add('ok');
  if(k=='p'&&G.sac&&m)d.classList.add('so');
  if(m)d.innerHTML=`<div class="mon${m.img?' art':''}"${m.img?` style="--art:url(${m.img})"`:''}>${atks(m).map((a,k)=>{const ok=act(a,i);return `<u class="at${a.r?' rg':''}${a.mg?' mg':''}${ok?'':' off'}${k?'':m.a<m.ba?' lo':m.a>m.ba?' hi':''}" style="bottom:${-.5+k*6.4}cqw">${a.d}${ok?'':'<s>✕</s>'}</u>`}).join('')}<u class="hp${m.h<m.mh?' lo':m.h>m.mh?' hi':''}">${m.h}${m.s>0?`<u class="sh"><em class="si"></em><i>${m.s}</i></u>`:''}</u><span>${sk(m)}</span>${m.eq?`<u class="eq${m.eq.img?' im':''}" title="${m.eq.n}"${m.eq.img?` style="background-image:url(${m.eq.img})"`:''}>${m.eq.img?'':m.eq.e}</u>`:''}</div>`;
  el.appendChild(d)})}
 $('#hand').innerHTML=G.p.hand.map((c,i)=>!c?`<div class="cd em ${hp(i)}" data-i="${i}"></div>`:`<div class="cd ${c.y=='i'?'it':''} ${c.q=='p'?'sp':''} ${hp(i)} ${G.sel===i?'sel':''} ${G.sac?'so':''}${c.img?' art':''}" data-i="${i}"${c.img?` style="--art:url(${c.img})"`:''}><span class="co">${c.c}</span><i>${c.n}</i>${c.y=='m'?hx(c):c.k=='b'?hx({b:c.v}):`<span>${c.d}</span>`}${c.y=='m'?`<u class="at${c.r?' rg':''}${c.mg?' mg':''}">${c.a}</u><u class="hp">${c.h}</u>`:c.k=='a'?`<u class="at">${c.v}</u>`:c.k=='h'?`<u class="at hl">${c.v}</u>`:c.k=='s'?`<span class="shd"><em class="si"></em><i>${c.v}</i></span>`:''}</div>`).join('');
 const side=(k,nm)=>{const S=G[k];return`${nm} · 🐾${S.dm.length} 🎒${S.di.length}`};
 $('#h1').innerHTML=side('o','Địch');$('#h2').innerHTML=side('p','Bạn');
 $('#en').innerHTML=`<em class="mi"></em> ${G.en}`;$('#end').disabled=G.busy;$('#sac').disabled=G.busy||G.sd;$('#sac').textContent=G.sac?'Hủy':'Hiến tế'}
function inspect(k,i){const m=G[k].board[i];if(!m)return;sfx('pick');
 const b=M.find(x=>x.n==m.n)||{},it=m.eq&&I.find(x=>x.n==m.eq.n);
 const mc=`<div class="cd${m.img?' art':''}"${m.img?` style="--art:url(${m.img})"`:''}><span class="co">${b.c??''}</span><i>${m.n}</i>${hx(m)}${atks(m).map((a,j)=>`<u class="at${a.r?' rg':''}${a.mg?' mg':''}${j?'':m.a<m.ba?' lo':m.a>m.ba?' hi':''}" style="bottom:${-.5+j*6.4}cqw">${a.d}</u>`).join('')}<u class="hp${m.h<m.mh?' lo':m.h>m.mh?' hi':''}">${m.h}</u></div>`;
 const wc=it?`<div class="cd it${it.img?' art':''}"${it.img?` style="--art:url(${it.img})"`:''}><span class="co">${it.c}</span><i>${it.n}</i>${it.k=='b'?hx({b:it.v}):`<span>${it.d}</span>`}${it.k=='a'?`<u class="at">${it.v}</u>`:''}</div>`:m.eq?`<div class="cd it"><span class="co"></span><i>${m.eq.n}</i></div>`:'<div class="empty">Chưa trang bị</div>';
 const nt=[m.r&&!m.mg?'Tầm xa: đánh được từ hàng sau, không bị gai phản.':'',m.mg?'Phép thuật: sát thương bỏ qua khiên.':'',m.s>0?`Khiên ${m.s}: chịu thay ${m.s} sát thương.`:'',m.t>0?`Gai ${m.t}: phản ${m.t} sát thương cho kẻ đánh cận chiến.`:'',m.b>0?`Chặn ${m.b}: vô hiệu ${m.b} đòn.`:''].filter(Boolean).map(t=>`<div>• ${t}</div>`).join('');
 $('#ins').innerHTML=`<div class="who ${k}">${k=='p'?'Bạn':'Địch'}</div><div class="pair"><div class="col">${mc}<span>Quái vật</span></div><div class="col">${wc}<span>Trang bị</span></div></div>${nt?`<div class="nt">${nt}</div>`:''}<div class="hint">Chạm để đóng</div>`;
 $('#ins').style.display='flex'}
function fx(k,i,t){const el=document.querySelector(`.slot[data-s="${k}"][data-i="${i}"]`);if(!el)return;const s=document.createElement('span');s.className='fl';s.textContent=t;el.appendChild(s);setTimeout(()=>s.remove(),900)}
function hit(x,d,mg){if(x.b>0){x.b--;return'Chặn!'}if(mg){x.h-=d;return'-'+d+' ✨'}const a=Math.min(x.s,d);x.s-=a;x.h-=d-a;return'-'+(d-a)+(a?' 🛡️'+a:'')}
const atks=m=>{const l=[{r:!!m.r,mg:!!m.mg,d:m.a}];if(m.r&&m.sw>0)l.push({r:false,d:m.sw});return l},act=(a,i)=>a.mg?true:a.r?i>0:i==0;
const canAtk=(m,i)=>atks(m).some(a=>act(a,i));
const compact=B=>{const a=B.filter(Boolean);while(a.length<3)a.push(null);B.splice(0,3,...a)};
const clean=()=>['p','o'].forEach(k=>{const B=G[k].board;B.forEach((m,j)=>{if(m&&m.h<=0){B[j]=null;sfx('die')}});compact(B)});
async function attack(k){const S=G[k],ek=k=='p'?'o':'p',E=G[ek];
 for(const m of[...S.board]){const i=S.board.indexOf(m);if(!m||i<0||m.h<=0||!canAtk(m,i))continue;
  const al=[0,1,2].filter(j=>E.board[j]);if(!al.length)break;
  const at=atks(m).find(a=>act(a,i)),rg=at.r,j=at.mg?(E.board[i]?i:al[0]):rg?(i==1?[2,1,0]:[1,2,0]).find(x=>E.board[x]):al[0],t=E.board[j];
  const tx=hit(t,at.d,at.mg);let rx=null;if(!rg&&t.t>0)rx=hit(m,t.t);G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.n+' đánh '+t.n+' ('+tx+')'+(rx?', gai '+rx:'')+(t.h<=0?' ☠️ '+t.n+' bị diệt':'')+(m.h<=0?' ☠️ '+m.n+' bị diệt':''));sfx(at.mg?'item':rg?'bow':'sword');setTimeout(()=>sfx(tx=='Chặn!'?'block':tx.includes('🛡️')?'shield':'hit'),130);if(rx)setTimeout(()=>sfx('thorn'),330);
  render();document.querySelector(`.slot[data-s="${k}"][data-i="${i}"]`)?.classList.add('go');fx(ek,j,tx);if(rx)fx(k,i,'🌵'+rx);
  await sleep(700);clean();render()}
 return lost('o')||lost('p')}
async function enemy(){const S=G.o;let en=G.oen;
 for(let n=0;n<8;n++){const emp=[0,1,2].filter(j=>!S.board[j]),mons=[0,1,2].filter(j=>S.board[j]);let pk=null,ti=null;
  const opts=S.hand.map((c,i)=>({c,i})).filter(x=>x.c&&x.c.c<=en);
  for(const x of opts)if(x.c.y=='m'&&emp.length){pk=x;ti=emp[0];break}
  if(!pk)for(const x of opts)if(x.c.y=='i'&&mons.length){let ts=mons;if(x.c.k=='h')ts=mons.filter(j=>S.board[j].h<S.board[j].mh);if(x.c.k=='t')ts=mons.filter(j=>!S.board[j].r);if(x.c.k=='b')ts=mons.filter(j=>!S.board[j].b);if(x.c.q=='e')ts=ts.filter(j=>!S.board[j].eq);if(ts.length){pk=x;ti=rnd(ts);break}}
  if(!pk)break;en-=pk.c.c;sfx(pk.c.y=='m'?'play':pk.c.k=='h'?'heal':'item');{const tm=S.board[ti];G.lg.push('Địch: '+pk.c.n+(pk.c.y=='m'?' → ô '+(ti+1):' → '+tm.n))}useCard(S,pk.i,ti);render();await sleep(600)}G.oen=en}
function fin(){const a=lost('o'),b=lost('p');let r;
 r=a&&b?'🤝 Hòa':a?'🏆 Bạn thắng!':'💀 Bạn thua';
 $('#ovt').textContent=r;$('#ov').style.display='flex';sfx(r.startsWith('🏆')?'win':r.startsWith('💀')?'lose':'turn')}
async function endTurn(){if(G.busy)return;G.busy=true;G.sel=null;G.sac=false;sfx('turn');render();
 if(await attack('p'))return fin();
 await sleep(400);await enemy();
 if(await attack('o'))return fin();
 G.turn++;G.lg.push('— Lượt '+G.turn+' —');
 G.en+=3;G.oen+=3;G.sd=false;G.busy=false;sfx('turn');render()}
function sacrifice(w,i){const S=G.p;let c,g;
 if(w=='h'){c=S.hand[i];g=c.y=='m'?2:1;const n=draw(S,c.y);if(n)S.hand[i]=n;else S.hand[i]=null}
 else{c=S.board[i];g=1;S.board[i]=null;compact(S.board)}
 G.en+=g;G.sd=true;G.sac=false;G.sel=null;G.lg.push('Bạn hiến tế '+c.n+' → +'+g+' ⚡');sfx('item');render()}
$('#sac').onclick=()=>{if(G.busy||G.sd)return;G.sac=!G.sac;G.sel=null;sfx('pick');render()};
$('#hand').onclick=e=>{const c=e.target.closest('.cd');if(!c||G.busy)return;const i=+c.dataset.i,cd=G.p.hand[i];if(!cd)return;
 if(G.sac)return sacrifice('h',i);
 G.sel=G.sel===i?null:i;sfx('pick');render()};
$('#p').onclick=e=>{const s=e.target.closest('.slot');if(!s||G.busy)return;const i=+s.dataset.i;
 if(G.sac){if(G.p.board[i])sacrifice('b',i);return}
 if(G.sel==null||!valid(i)){if(G.p.board[i])inspect('p',i);return}
 const c=G.p.hand[G.sel],tm=G.p.board[i];G.lg.push('Bạn: '+c.n+(c.y=='m'?' → ô '+(i+1):' → '+tm.n));sfx(c.y=='m'?'play':c.k=='h'?'heal':'item');G.en-=c.c;useCard(G.p,G.sel,i);G.sel=null;render()};
$('#o').onclick=e=>{const s=e.target.closest('.slot');if(!s||G.busy)return;inspect('o',+s.dataset.i)};
$('#ins').onclick=()=>{$('#ins').style.display='none'};
$('#end').onclick=endTurn;$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊';if(!mute)sfx('pick')};const openLog=()=>{$('#lgl').innerHTML=G.lg.map(t=>`<div${t[0]=='—'?' class="tn"':''}>${t}</div>`).join('');$('#lgp').style.display='flex';$('#lgl').scrollTop=1e9};
$('#lgb').onclick=$('#lgb2').onclick=openLog;$('#lgx').onclick=()=>$('#lgp').style.display='none';
$('#sur').onclick=()=>{if(G.busy||$('#ov').style.display=='flex')return;$('#cf').style.display='flex'};
$('#cfn').onclick=()=>{$('#cf').style.display='none'};
$('#cfy').onclick=()=>{$('#cf').style.display='none';if(G.busy)return;G.busy=true;G.sel=null;G.lg.push('Bạn đã đầu hàng');$('#ovt').textContent='🏳️ Bạn đã đầu hàng';$('#ov').style.display='flex';sfx('lose');render()};
$('#again').onclick=start;start();
</script></body></html>
