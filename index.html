<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Card Monsters – Đấu trường rừng xanh</title>
<style>
:root{--hp-y:0cqw;--heart:url(Assets/UI/heart_icon.png);--atk:url(Assets/UI/attack_icon.png);--sword:url(Assets/UI/sword_icon.png);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--gold:#c9b57a;--red:#b86a6a;--ink:#2a2113}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0b140e;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
#board{position:relative;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*.558));aspect-ratio:768/1376;background:#1c2a1d url(Assets/UI/1.jpg) center/100% 100% no-repeat;container-type:inline-size;overflow:hidden;user-select:none;-webkit-user-select:none}
#hud,#bar{position:absolute;left:3%;right:3%;background:#000a;border-radius:2cqw;padding:1.4cqw 2.5cqw}
#hud{top:1.5%;display:flex;justify-content:space-between;align-items:flex-start;font-size:3.4cqw;line-height:1.3}
#h1{color:#f0a8a0;text-align:left}#h2{color:#a8e0a8;text-align:right}
.row{position:absolute;left:0;width:100%;height:17%}
#o{top:21.2%}#p{top:51.2%}
.slot{position:absolute;top:0;width:24.3%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2cqw}
.c0{left:37.7%}.c1{left:11.3%}.c2{left:64.3%}
.slot.ok{background:#ffe27a33;box-shadow:0 0 0 .6cqw #ffe27a;animation:pu 1s infinite alternate}
@keyframes pu{to{background:#ffe27a66}}
.mon{position:relative;width:88%;height:84%;background:linear-gradient(#2e3f2c,#17221a);border:.5cqw solid var(--gold);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding:.8cqw 0 4.5cqw;font-size:2.5cqw;text-align:center;box-shadow:0 .5cqw 1.5cqw #000a}
.o .mon{border-color:var(--red)}
.mon b{font-size:8cqw;line-height:1;font-weight:400}
.mon i{font-style:normal;font-weight:700}

.mon u{text-decoration:none;font-weight:700}
.mon .at,.mon .hp{position:absolute;bottom:.6cqw;font-size:3cqw}
.mon .hp{font-size:3.6cqw}
.mon .at{left:-.5cqw;bottom:-.5cqw;font-size:4.6cqw}.mon .hp{right:-.5cqw;bottom:-.5cqw}
.mon .sh{position:absolute;right:-.1cqw;bottom:6.3cqw;font-size:3cqw}
.mon span{position:absolute;top:-6cqw;left:50%;transform:translateX(-50%);display:flex;gap:1.2cqw}
.mon .sk{position:relative;font-size:5cqw;line-height:1}
.mon .sk i{position:absolute;left:50%;bottom:-.8cqw;transform:translateX(-50%);font-size:2.8cqw;font-weight:800;color:#fff;text-shadow:0 0 .5cqw #000,0 0 .5cqw #000,0 0 .5cqw #000}
.fl{position:absolute;top:10%;left:-20%;right:-20%;text-align:center;font-weight:800;font-size:4cqw;color:#ff8a78;text-shadow:0 0 .6cqw #000,0 0 .6cqw #000,0 0 .6cqw #000;animation:fl .9s forwards;pointer-events:none;z-index:5}
@keyframes fl{to{transform:translateY(-6cqw);opacity:0}}
.go .mon{transform:scale(1.08);transition:transform .15s}
#hand{position:absolute;left:3%;right:3%;top:69%;height:21%;display:flex;justify-content:center;gap:0;overflow-x:auto;padding:3cqw 0 1cqw}
.cd{flex:0 0 28cqw;background:linear-gradient(#f3e6c4,#d6c28f);color:var(--ink);border:.5cqw solid #6b5420;border-radius:1.6cqw;font-size:2.4cqw;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.2cqw .5cqw 7cqw;position:relative;cursor:pointer;box-shadow:0 .5cqw 1.2cqw #0008}
.cd b{font-size:7cqw;line-height:1;font-weight:400}
.cd i{font-style:normal;font-weight:700}
.cd u{position:absolute;bottom:.8cqw;font-size:2.8cqw;font-weight:700;text-decoration:none}
.cd .at{left:-.5cqw;bottom:-.5cqw}.cd .hp{right:-.5cqw;bottom:-.5cqw;font-size:3.6cqw}
.hxs{display:flex;gap:.7cqw;justify-content:center}
.cd .hx{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;width:5.8cqw;height:6.4cqw;font-style:normal;font-size:3.4cqw;line-height:1}
.cd .hx::after{content:"";position:absolute;inset:0;z-index:-2;background:#6b5420;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cd .hx::before{content:"";position:absolute;inset:.4cqw;z-index:-1;background:#2b2a1d;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cd .hx.e::before{background:#4a4538}
.cd .sk i{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);line-height:1;font-size:2.8cqw;font-weight:800;color:#fff;text-shadow:-.3cqw 0 #000,.3cqw 0 #000,0 -.3cqw #000,0 .3cqw #000,-.25cqw -.25cqw #000,.25cqw -.25cqw #000,-.25cqw .25cqw #000,.25cqw .25cqw #000}

.cd.it{background:linear-gradient(#d4e8dc,#9fc2ae)}
.cd.ov{margin-left:-14cqw}.cd.gp{margin-left:2cqw}
.cd.sel{transform:translateY(-2.5cqw);box-shadow:0 0 2cqw #ffe27a;z-index:5}
.cd.dim{opacity:.5}
.co{position:absolute;top:-1.2cqw;left:-1.2cqw;background:#3a6fd0;color:#fff;border-radius:50%;width:5cqw;height:5cqw;line-height:5cqw;font-weight:700;font-size:3cqw}
#bar{top:91.5%;display:flex;justify-content:space-between;align-items:center;font-size:3.2cqw}
button{font:inherit;font-weight:700;background:linear-gradient(#e6c66a,#b8913a);color:var(--ink);border:.4cqw solid #6b5420;border-radius:2cqw;padding:1cqw 4cqw;cursor:pointer}
button:disabled{opacity:.45}
#mu,#lgb{padding:1cqw 2.5cqw}
#ov{position:absolute;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:8cqw;gap:4cqw;z-index:9;text-align:center}
#ov button{font-size:5cqw}
#lgp{position:absolute;inset:0;background:#000e;display:none;flex-direction:column;gap:3cqw;padding:5cqw;z-index:10;box-sizing:border-box}
#lgp h2{margin:0;text-align:center;font-size:5cqw;color:var(--gold)}
#lgl{flex:1;overflow-y:auto;font-size:3cqw;line-height:1.5;text-align:left}
#lgl .tn{color:var(--gold);font-weight:700;margin-top:1.5cqw}
#lgp button{font-size:4cqw}
u.at{isolation:isolate;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-bottom:.3cqw;width:6.4cqw;height:6.4cqw;font-size:4.6cqw;line-height:1;color:#fff;font-weight:900;text-shadow:-.35cqw 0 #1a0d0d,.35cqw 0 #1a0d0d,0 -.35cqw #1a0d0d,0 .35cqw #1a0d0d,-.28cqw -.28cqw #1a0d0d,.28cqw -.28cqw #1a0d0d,-.28cqw .28cqw #1a0d0d,.28cqw .28cqw #1a0d0d}
u.at::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--atk) center/contain no-repeat}
u.at:not(.rg)::after{content:"";position:absolute;left:-.6cqw;top:-0.29cqw;width:3.8cqw;height:3.8cqw;z-index:-1;background:var(--sword) center/contain no-repeat}
u.at.rg::after{content:"🏹";position:absolute;top:-2.2cqw;left:-.4cqw;font-size:3.2cqw;line-height:1;text-shadow:none}
.hp{isolation:isolate;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:.4cqw 0 var(--hp-y);width:6.4cqw;height:6cqw;color:#fff;font-weight:900;text-shadow:-.35cqw 0 #1a0d0d,.35cqw 0 #1a0d0d,0 -.35cqw #1a0d0d,0 .35cqw #1a0d0d,-.28cqw -.28cqw #1a0d0d,.28cqw -.28cqw #1a0d0d,-.28cqw .28cqw #1a0d0d,.28cqw .28cqw #1a0d0d}
.hp::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--heart) center/8.8cqw 8.8cqw no-repeat}
@media (prefers-reduced-motion:reduce){.slot.ok,.fl{animation:none}}
</style></head><body>
<div id="board">
<div id="hud"><span id="h1"></span><span id="h2"></span></div>
<div id="o" class="row"></div><div id="p" class="row"></div>
<div id="hand"></div>
<div id="bar"><span id="en"></span><button id="mu">🔊</button><button id="lgb">📜</button><button id="end">Kết thúc lượt</button></div>
<div id="ov"><div id="ovt"></div><button id="again">Chơi lại</button><button id="lgb2">Nhật ký</button></div>
<div id="lgp"><h2>Nhật ký</h2><div id="lgl"></div><button id="lgx">Đóng</button></div>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=a=>a[Math.random()*a.length|0];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const M=[{n:'Sói rừng',e:'🐺',c:1,a:3,h:5},{n:'Gấu đá',e:'🐻',c:2,a:3,h:9},{n:'Nhím gai',e:'🦔',c:2,a:2,h:6,t:2},{n:'Rùa khiên',e:'🐢',c:2,a:2,h:6,s:3},{n:'Cáo cung',e:'🦊',c:1,a:2,h:4,r:1},{n:'Cú phép',e:'🦉',c:2,a:3,h:5,r:1},{n:'Rồng con',e:'🐲',c:3,a:5,h:8}];
const I=[{n:'Kiếm',e:'⚔️',c:1,k:'a',v:2,d:'+2 công'},{n:'Khiên',e:'🛡️',c:1,k:'s',v:3,d:'+3 khiên'},{n:'Gai',e:'🌵',c:1,k:'t',v:2,d:'+2 gai'},{n:'Đỡ',e:'✋',c:1,k:'b',v:1,d:'Chặn 1 đòn'},{n:'Thuốc',e:'🧪',c:1,k:'h',v:4,d:'+4 máu'}];
let AC,mute=false;
const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC};
function tone(f,d,ty='sine',v=.15,t0=0,f2){const a=au();if(!a||mute)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.2,fc=1500,t0=0){const a=au();if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const SFX={pick:()=>tone(660,.08,'triangle',.1),play:()=>{tone(300,.12,'triangle',.15,0,500);noise(.08,.1,3000)},item:()=>{tone(700,.1,'sine',.12);tone(1050,.14,'sine',.1,.08)},sword:()=>{noise(.12,.18,5000);tone(220,.1,'sawtooth',.08,0,110)},bow:()=>{tone(900,.14,'triangle',.1,0,300);noise(.06,.08,6000,.1)},hit:()=>{noise(.15,.3,900);tone(140,.15,'square',.1,0,60)},shield:()=>{tone(1200,.1,'square',.07);tone(800,.18,'triangle',.1,.03)},block:()=>{tone(500,.08,'square',.1);noise(.05,.12,4000)},thorn:()=>{tone(1400,.06,'sawtooth',.06);tone(1000,.08,'sawtooth',.06,.05)},heal:()=>[523,659,784].forEach((f,i)=>tone(f,.18,'sine',.1,i*.09)),turn:()=>{tone(392,.15,'triangle',.12);tone(523,.2,'triangle',.12,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.14)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.35,'sawtooth',.08,i*.18)),die:()=>{tone(200,.3,'sawtooth',.1,0,50);noise(.2,.2,600)}};
const sfx=k=>{try{SFX[k]()}catch(e){}};
let G;
const DM=[0,0,1,2,3,4,5,6],DI=[0,0,1,1,2,3,4,4];
const mk=(y,L,a)=>shuf(a.map(i=>({y,...L[i]})));
const draw=(S,y)=>(y=='m'?S.dm:S.di).pop();
const newSide=()=>{const S={dm:mk('m',M,DM),di:mk('i',I,DI),board:[null,null,null],pl:false};S.hand=[draw(S,'m'),draw(S,'m'),draw(S,'i'),draw(S,'i')];return S};
const inst=c=>({n:c.n,e:c.e,a:c.a,h:c.h,mh:c.h,s:c.s||0,t:c.t||0,b:0,r:!!c.r});
function useCard(S,hi,ti){const c=S.hand[hi],m=S.board[ti];if(c.y=='m')S.board[ti]=inst(c);else if(c.k=='h')m.h=Math.min(m.mh,m.h+c.v);else m[c.k]+=c.v;{const n=draw(S,c.y);if(n)S.hand[hi]=n;else S.hand.splice(hi,1)}if(c.y=='m')S.pl=true}
const lost=k=>{const S=G[k];return !S.board.some(Boolean)&&!S.hand.some(c=>c.y=='m')&&!S.dm.length};
function start(){G={p:newSide(),o:newSide(),en:3,oen:3,turn:1,sel:null,busy:false,lg:['— Lượt 1 —']};$('#ov').style.display='none';$('#lgp').style.display='none';render()}
const valid=i=>{const c=G.p.hand[G.sel];return c&&(c.y=='m'?!G.p.board[i]:!!G.p.board[i])};
const sk=m=>[['t','🌵'],['b','✋']].filter(([k])=>m[k]>0).map(([k,e])=>`<u class="sk">${e}<i>${m[k]}</i></u>`).join('');
const hx=c=>{const l=[['s','🛡️'],['t','🌵'],['b','✋']].filter(([k])=>c[k]>0);return`<span class="hxs">${[0,1,2].map(n=>l[n]?`<em class="hx sk">${l[n][1]}<i>${c[l[n][0]]}</i></em>`:`<em class="hx e"></em>`).join('')}</span>`};
function render(){
 for(const k of['o','p']){const el=$('#'+k);el.innerHTML='';[1,0,2].forEach(i=>{const m=G[k].board[i],d=document.createElement('div');d.className='slot c'+i+' '+k;d.dataset.s=k;d.dataset.i=i;
  if(k=='p'&&G.sel!=null&&valid(i))d.classList.add('ok');
  if(m)d.innerHTML=`<div class="mon"><u class="at${m.r?' rg':''}">${m.a}</u><u class="hp">${m.h}</u>${m.s>0?`<u class="sh">🛡️${m.s}</u>`:''}<b>${m.e}</b><span>${sk(m)}</span></div>`;
  el.appendChild(d)})}
 $('#hand').innerHTML=G.p.hand.map((c,i,a)=>`<div class="cd ${c.y=='i'?'it':''} ${i&&a[i-1].y==c.y?'ov':i?'gp':''} ${G.sel===i?'sel':''} ${c.c>G.en?'dim':''}" data-i="${i}"><span class="co">${c.c}</span><b>${c.e}</b><i>${c.n}</i>${c.y=='m'?hx(c):`<span>${c.d}</span>`}${c.y=='m'?`<u class="at${c.r?' rg':''}">${c.a}</u><u class="hp">${c.h}</u>`:''}</div>`).join('');
 const side=(k,nm)=>{const S=G[k];return`${nm} · 🐾${S.dm.length} 🎒${S.di.length}`};
 $('#h1').innerHTML=side('o','Địch');$('#h2').innerHTML=side('p','Bạn');
 $('#en').textContent=`⚡ ${G.en}`;$('#end').disabled=G.busy}
function fx(k,i,t){const el=document.querySelector(`.slot[data-s="${k}"][data-i="${i}"]`);if(!el)return;const s=document.createElement('span');s.className='fl';s.textContent=t;el.appendChild(s);setTimeout(()=>s.remove(),900)}
function hit(x,d){if(x.b>0){x.b--;return'Chặn!'}const a=Math.min(x.s,d);x.s-=a;x.h-=d-a;return'-'+(d-a)+(a?' 🛡️'+a:'')}
const clean=()=>['p','o'].forEach(k=>G[k].board.forEach((m,j)=>{if(m&&m.h<=0){G[k].board[j]=null;sfx('die')}}));
async function attack(k){const S=G[k],ek=k=='p'?'o':'p',E=G[ek];
 for(let i=0;i<3;i++){const m=S.board[i];if(!m||m.h<=0||(!m.r&&i))continue;
  const al=[0,1,2].filter(j=>E.board[j]);if(!al.length)break;
  const j=m.r?al.reduce((a,b)=>E.board[a].h<=E.board[b].h?a:b):al[0],t=E.board[j];
  const tx=hit(t,m.a);let rx=null;if(!m.r&&t.t>0)rx=hit(m,t.t);G.lg.push((k=='p'?'Bạn':'Địch')+': '+m.e+' '+m.n+' đánh '+t.e+' '+t.n+' ('+tx+')'+(rx?', gai '+rx:'')+(t.h<=0?' ☠️ '+t.n+' bị diệt':'')+(m.h<=0?' ☠️ '+m.n+' bị diệt':''));sfx(m.r?'bow':'sword');setTimeout(()=>sfx(tx=='Chặn!'?'block':tx.includes('🛡️')?'shield':'hit'),130);if(rx)setTimeout(()=>sfx('thorn'),330);
  render();document.querySelector(`.slot[data-s="${k}"][data-i="${i}"]`)?.classList.add('go');fx(ek,j,tx);if(rx)fx(k,i,'🌵'+rx);
  await sleep(700);clean();render()}
 return lost('o')||lost('p')}
async function enemy(){const S=G.o;let en=G.oen;
 for(let n=0;n<8;n++){const emp=[0,1,2].filter(j=>!S.board[j]),mons=[0,1,2].filter(j=>S.board[j]);let pk=null,ti=null;
  const opts=S.hand.map((c,i)=>({c,i})).filter(x=>x.c.c<=en);
  for(const x of opts)if(x.c.y=='m'&&emp.length){pk=x;ti=x.c.r?(emp.find(j=>j)??0):(emp.includes(0)?0:emp[0]);break}
  if(!pk)for(const x of opts)if(x.c.y=='i'&&mons.length){let ts=mons;if(x.c.k=='h')ts=mons.filter(j=>S.board[j].h<S.board[j].mh);if(x.c.k=='t')ts=mons.filter(j=>!S.board[j].r);if(ts.length){pk=x;ti=rnd(ts);break}}
  if(!pk)break;en-=pk.c.c;sfx(pk.c.y=='m'?'play':pk.c.k=='h'?'heal':'item');{const tm=S.board[ti];G.lg.push('Địch: '+pk.c.e+' '+pk.c.n+(pk.c.y=='m'?' → ô '+(ti+1):' → '+tm.e+' '+tm.n))}useCard(S,pk.i,ti);render();await sleep(600)}G.oen=en}
function fin(){const a=lost('o'),b=lost('p');let r;
 r=a&&b?'🤝 Hòa':a?'🏆 Bạn thắng!':'💀 Bạn thua';
 $('#ovt').textContent=r;$('#ov').style.display='flex';sfx(r.startsWith('🏆')?'win':r.startsWith('💀')?'lose':'turn')}
async function endTurn(){if(G.busy)return;G.busy=true;G.sel=null;sfx('turn');render();
 if(await attack('p'))return fin();
 await sleep(400);await enemy();
 if(await attack('o'))return fin();
 G.turn++;G.lg.push('— Lượt '+G.turn+' —');
 G.en+=3;G.oen+=3;G.busy=false;sfx('turn');render()}
$('#hand').onclick=e=>{const c=e.target.closest('.cd');if(!c||G.busy)return;const i=+c.dataset.i,cd=G.p.hand[i];
 if(cd.c>G.en)return
 G.sel=G.sel===i?null:i;sfx('pick');render()};
$('#p').onclick=e=>{const s=e.target.closest('.slot');if(!s||G.busy||G.sel==null)return;const i=+s.dataset.i;
 if(!valid(i))return
 const c=G.p.hand[G.sel],tm=G.p.board[i];G.lg.push('Bạn: '+c.e+' '+c.n+(c.y=='m'?' → ô '+(i+1):' → '+tm.e+' '+tm.n));sfx(c.y=='m'?'play':c.k=='h'?'heal':'item');G.en-=c.c;useCard(G.p,G.sel,i);G.sel=null;render()};
$('#end').onclick=endTurn;$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊';if(!mute)sfx('pick')};const openLog=()=>{$('#lgl').innerHTML=G.lg.map(t=>`<div${t[0]=='—'?' class="tn"':''}>${t}</div>`).join('');$('#lgp').style.display='flex';$('#lgl').scrollTop=1e9};
$('#lgb').onclick=$('#lgb2').onclick=openLog;$('#lgx').onclick=()=>$('#lgp').style.display='none';
$('#again').onclick=start;start();
</script></body></html>
